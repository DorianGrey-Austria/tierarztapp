name: 🏥 Deploy VetScan Pro to Root Domain

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: 🎉 Deploy to vibecoding.company
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🏥 Deploy VetScan Pro to Root Domain
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /public_html/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.github/**
          **/*.log
          **/.DS_Store
          **/.vscode/**
          **/.idea/**
          **/test-results/**
          **/*.tmp
          **/*.temp
          **/scripts/**
          **/README.md
          **/package*.json
          **/tests/**
          **/playwright.config.js
          **/*.spec.js
          **/playwright-report/**
        dry-run: false
        log-level: verbose
        timeout: 60000
        security: loose