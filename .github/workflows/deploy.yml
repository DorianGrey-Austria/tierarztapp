name: Deploy to Hostinger - vibecoding.company

# Single source of truth for production deploys (consolidated 2026-07).
# Strategy: SFTP primary (encrypted, SSH port 65002) -> FTPS fallback on failure.
# Plain FTP is intentionally NOT used (unencrypted, 2026 best practice).
# Secrets required: see DEPLOY.md.

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Erlaubt manuelles Triggern

# Never run two production deploys at once (last push wins).
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Prepare Production Files
      run: |
        echo "🚀 Preparing Tierarztspiel files for vibecoding.company deployment..."
        
        # Erstelle deployment Ordner
        mkdir -p deploy
        
        # Copy ALL HTML game files (glob instead of individual cp)
        cp vetscan-*.html deploy/ 2>/dev/null || true
        cp standalone.html deploy/ 2>/dev/null || true
        cp vetgame-missions.html deploy/ 2>/dev/null || true
        cp test-rabbit-3d.html deploy/ 2>/dev/null || true
        cp turtle-model-test.html deploy/ 2>/dev/null || true

        # Copy JS directory (shared module, pro module, Version 9)
        cp -r js deploy/ 2>/dev/null || true

        # Copy Service Worker to root
        cp sw.js deploy/ 2>/dev/null || true

        # Copy PWA + SEO files (manifest, offline fallback, robots, sitemap)
        cp manifest.json deploy/ 2>/dev/null || true
        cp offline.html deploy/ 2>/dev/null || true
        cp robots.txt deploy/ 2>/dev/null || true
        cp sitemap.xml deploy/ 2>/dev/null || true

        # Copy assets for 3D models (includes assets/icons/ for the PWA icons)
        cp -r assets deploy/ 2>/dev/null || true
        cp -r public deploy/ 2>/dev/null || true
        
        # Curated best-of hub is the production index.html (single source of truth
        # across both deploy workflows). Marketing landing page stays reachable at landing.html.
        cp index.html deploy/index.html
        cp landing.html deploy/landing.html 2>/dev/null || true
        
        # Erstelle .htaccess für HTTPS und Performance
        cat > deploy/.htaccess << 'EOF'
        # Force HTTPS
        RewriteEngine On
        RewriteCond %{HTTPS} !=on
        RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
        
        # Enable compression for faster loading
        <ifModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html
            AddOutputFilterByType DEFLATE text/css
            AddOutputFilterByType DEFLATE application/javascript
            AddOutputFilterByType DEFLATE application/json
            AddOutputFilterByType DEFLATE image/svg+xml
        </ifModule>
        
        # Cache static assets
        <ifModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 month"
            ExpiresByType application/javascript "access plus 1 month"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/jpg "access plus 1 year"
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/gif "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 year"
            ExpiresByType model/gltf-binary "access plus 1 year"
            ExpiresByType application/octet-stream "access plus 1 month"
        </ifModule>

        # MIME types for 3D models and PWA manifest
        AddType model/gltf-binary .glb
        AddType model/gltf+json .gltf
        AddType application/manifest+json .webmanifest

        # Force correct MIME type for the PWA manifest
        <Files "manifest.json">
            Header set Content-Type "application/manifest+json"
        </Files>

        # Service worker and manifest must NOT be long-cached (updates must propagate)
        <FilesMatch "(sw\.js|manifest\.json)$">
            <ifModule mod_expires.c>
                ExpiresActive On
                ExpiresDefault "access plus 0 seconds"
            </ifModule>
            Header set Cache-Control "no-cache, must-revalidate"
        </FilesMatch>

        # Security headers
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options SAMEORIGIN
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        EOF
        
        echo "✅ Tierarztspiel files prepared for vibecoding.company"
        echo "📁 Files to deploy:"
        ls -la deploy/
        
    # --- PRIMARY: SFTP over SSH (encrypted, Hostinger port 65002) ---
    # Supports BOTH auth methods: SSH key (preferred) OR password fallback.
    # Provide EITHER SSH_PRIVATE_KEY or SSH_PASSWORD in repo secrets.
    - name: Deploy via SFTP (primary)
      id: sftp
      continue-on-error: true
      uses: wlixcc/SFTP-Deploy-Action@v1.2.6
      with:
        server: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT || 65002 }}
        username: ${{ secrets.SSH_USERNAME }}
        ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
        password: ${{ secrets.SSH_PASSWORD }}
        local_path: './deploy/*'
        remote_path: '/public_html/'
        sftp_only: true
        delete_remote_files: false

    # --- FALLBACK: FTPS (FTP over TLS) — only if SFTP failed ---
    # security: loose is required for Hostinger's certificate chain.
    - name: Deploy via FTPS (fallback)
      if: steps.sftp.outcome == 'failure'
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        security: loose
        local-dir: ./deploy/
        server-dir: /public_html/
        dry-run: false
        log-level: verbose
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.DS_Store
          **/Thumbs.db
          **/*.backup
          **/*.md

    - name: Deploy result
      run: |
        if [ "${{ steps.sftp.outcome }}" = "success" ]; then
          echo "Deployed via SFTP (primary)."
        else
          echo "SFTP failed -> deployed via FTPS (fallback)."
        fi
        echo "Live: https://vibecoding.company/"
        echo "Finished at $(date)"