                extend: {

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Puls-Animation fuer Notfall-Atmosphaere */
        @keyframes pulse-emergency {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
        }

        @keyframes pulse-border {
            0%, 100% { border-color: rgba(220, 38, 38, 0.3); }
            50% { border-color: rgba(220, 38, 38, 0.8); }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.15); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            56% { transform: scale(1); }
        }

        @keyframes siren-glow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes countdown-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes slide-in {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .animate-slide-in { animation: slide-in 0.4s ease-out; }
        .animate-fade-in { animation: fade-in 0.3s ease-out; }

        .pulse-emergency { animation: pulse-emergency 1.5s ease-in-out infinite; }
        .pulse-border { animation: pulse-border 1.5s ease-in-out infinite; }
        .heartbeat { animation: heartbeat 1.2s ease-in-out infinite; }
        .countdown-pulse { animation: countdown-pulse 1s ease-in-out infinite; }

        .siren-bar {
            background: linear-gradient(90deg, #dc2626, #ff6644, #dc2626, #ff6644, #dc2626);
            background-size: 400% 100%;
            animation: siren-glow 2s linear infinite;
            height: 3px;
        }

        /* Triage-Farben */
        .triage-red { background: linear-gradient(135deg, #991b1b, #dc2626); border-color: #ef4444; }
        .triage-orange { background: linear-gradient(135deg, #9a3412, #ea580c); border-color: #f97316; }
        .triage-yellow { background: linear-gradient(135deg, #854d0e, #ca8a04); border-color: #eab308; }
        .triage-green { background: linear-gradient(135deg, #166534, #16a34a); border-color: #22c55e; }

        .triage-btn {
            transition: all 0.2s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .triage-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }
        .triage-btn.selected {
            ring: 3px;
            transform: scale(1.05);
        }

        /* Entscheidungsbaum */
        .decision-node {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .decision-node:hover {
            transform: translateX(4px);
            background: rgba(255, 255, 255, 0.08);
        }
        .decision-node.correct {
            border-color: #22c55e !important;
            background: rgba(34, 197, 94, 0.1) !important;
        }
        .decision-node.incorrect {
            border-color: #ef4444 !important;
            background: rgba(239, 68, 68, 0.1) !important;
        }

        /* Timer */
        .timer-critical {
            color: #ef4444;
            animation: countdown-pulse 0.5s ease-in-out infinite;
        }

        /* Progress Bar */
        .progress-fill {
            transition: width 0.5s ease;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }

        /* ABC-Badges */
        .abc-badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            flex-shrink: 0;
        }

        /* Score-Animation */
        @keyframes score-pop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }
        .score-pop { animation: score-pop 0.4s ease-out; }

        /* Glasmorphism fuer schwebende Elemente */
        .glass {
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Touch Targets */
        button, .decision-node, .triage-btn {
            min-height: 44px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

                        <button onclick="selectTriage('green')"

                            <div class="text-3xl font-black text-white">GRUEN</div>
                            <div class="text-sm text-green-200 mt-1 font-semibold">Warten</div>

                        Triage bestaetigen &#x27A1; ABC-Schema starten
                    </button>
                </div>
                ` : ''}

    function renderABC() {
        const s = state.currentScenario;
        const steps = ['a', 'b', 'c'];
        const stepLabels = ['A -- Airway', 'B -- Breathing', 'C -- Circulation'];
        const stepColors = ['red', 'blue', 'purple'];
        const currentStep = steps[state.abcStep];
        const abcData = s.abc[currentStep];

        const triageCorrect = state.triageChoice === s.triage;
        const triageFeedback = triageCorrect
            ? `Korrekt! ${s.triageLabel} ist die richtige Einstufung.`
            : `Die korrekte Einstufung waere ${s.triageLabel} gewesen.`;

        return `
            <div class="animate-slide-in">
                <!-- Timer -->
                ${renderTimerBar(s)}

                <!-- Szenario-Kurzinfo + Triage-Ergebnis -->
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 mb-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">${s.icon}</span>
                            <div>
                                <h2 class="text-lg font-bold text-white">${s.title}</h2>
                                <p class="text-xs text-gray-500">${s.species}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="triage-${s.triage} text-xs font-bold px-3 py-1 rounded-full text-white border">${s.triageLabel.split(' ')[0]}</span>
                            <span class="text-sm ${triageCorrect ? 'text-emerald-400' : 'text-red-400'}">${triageCorrect ? 'Korrekt!' : 'Falsch'}</span>
                        </div>
                    </div>
                </div>

                <!-- ABC-Progress -->
                <div class="flex gap-2 mb-4">
                    ${steps.map((step, i) => {
                        const isActive = i === state.abcStep;
                        const isDone = i < state.abcStep;
                        const color = stepColors[i];
                        return `
                        <div class="flex-1 rounded-xl p-3 border-2 transition-all ${isActive ? `bg-${color}-950/50 border-${color}-600` : isDone ? `bg-${color}-950/30 border-${color}-900/50 opacity-60` : 'bg-gray-800/30 border-gray-700/30 opacity-40'}">
                            <div class="flex items-center gap-2">
                                <div class="abc-badge ${isActive ? `bg-${color}-600` : isDone ? `bg-${color}-800` : 'bg-gray-700'} text-white text-sm" style="width:32px;height:32px;font-size:14px;">
                                    ${isDone ? '&#x2713;' : step.toUpperCase()}
                                </div>
                                <span class="text-xs font-semibold ${isActive ? 'text-white' : 'text-gray-500'}">${stepLabels[i]}</span>
                            </div>
                        </div>
                        `;
                    }).join('')}
                </div>

                <!-- Frage -->
                <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-4">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="abc-badge bg-${stepColors[state.abcStep]}-600 text-white">${currentStep.toUpperCase()}</div>
                        <h3 class="text-lg font-bold text-white">${abcData.question}</h3>
                    </div>
                    <div class="space-y-3">
                        ${abcData.options.map((opt, i) => `
                            <button onclick="selectABCAnswer(${i})"
                                class="decision-node w-full text-left bg-gray-800/50 border border-gray-700 rounded-xl p-4 transition-all hover:border-gray-500">
                                <div class="flex items-start gap-3">
                                    <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-sm font-bold text-white flex-shrink-0 mt-0.5">
                                        ${String.fromCharCode(65 + i)}
                                    </div>
                                    <span class="text-sm text-gray-300">${opt.text}</span>
                                </div>
                            </button>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
    }

    function renderABCFeedback(optionIndex) {
        const s = state.currentScenario;
        const steps = ['a', 'b', 'c'];
        const currentStep = steps[state.abcStep];
        const abcData = s.abc[currentStep];
        const chosen = abcData.options[optionIndex];
        const isCorrect = chosen.correct;

        // Kurz Feedback anzeigen, dann weiter
        const container = document.getElementById('main-content');
        const feedbackDiv = document.createElement('div');
        feedbackDiv.className = `fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 animate-fade-in`;
        feedbackDiv.innerHTML = `
            <div class="bg-gray-900 border ${isCorrect ? 'border-emerald-600' : 'border-red-600'} rounded-2xl p-6 max-w-lg w-full shadow-2xl animate-slide-in">
                <div class="flex items-center gap-3 mb-4">
                    <span class="text-3xl">${isCorrect ? '&#x2705;' : '&#x274C;'}</span>
                    <h3 class="text-lg font-bold ${isCorrect ? 'text-emerald-400' : 'text-red-400'}">
                        ${isCorrect ? 'Korrekt!' : 'Nicht optimal'}
                    </h3>
                </div>
                <p class="text-sm text-gray-300 mb-6">${chosen.feedback}</p>
                <button onclick="this.closest('.fixed').remove(); nextABCStep()"
                    class="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl transition-all">
                    ${state.abcStep < 2 ? 'Weiter zu ' + ['B -- Breathing', 'C -- Circulation'][state.abcStep] : 'Weiter zu Sofortmassnahmen'} &#x27A1;
                </button>
            </div>
        `;
        document.body.appendChild(feedbackDiv);
    }

    function renderActions() {
        const s = state.currentScenario;
        return `
            <div class="animate-slide-in">
                <!-- Timer -->
                ${renderTimerBar(s)}

                <!-- Szenario-Kurzinfo -->
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 mb-4">
                    <div class="flex items-center gap-3">
                        <span class="text-3xl">${s.icon}</span>
                        <div>
                            <h2 class="text-lg font-bold text-white">${s.title}</h2>
                            <p class="text-xs text-gray-500">${s.species} -- ABC abgeschlossen</p>
                        </div>
                        <span class="triage-${s.triage} text-xs font-bold px-3 py-1 rounded-full text-white border ml-auto">${s.triageLabel.split(' ')[0]}</span>
                    </div>
                </div>

                <!-- Sofortmassnahmen -->
                <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-4">
                    <h3 class="text-lg font-bold text-white mb-2">Sofortmassnahmen waehlen</h3>
                    <p class="text-sm text-gray-500 mb-4">Waehle alle Massnahmen, die du jetzt durchfuehren wuerdest. Korrekte Massnahmen geben Punkte, falsche kosten Punkte!</p>

                    <div class="space-y-3">
                        ${s.immediateActions.map((action, i) => {
                            const isSelected = state.selectedActions.includes(i);
                            return `
                            <button onclick="toggleAction(${i})"
                                class="decision-node w-full text-left border rounded-xl p-4 transition-all ${isSelected ? 'bg-red-950/30 border-red-600' : 'bg-gray-800/50 border-gray-700 hover:border-gray-500'}">
                                <div class="flex items-start gap-3">
                                    <div class="w-7 h-7 rounded-lg ${isSelected ? 'bg-red-600' : 'bg-gray-700'} flex items-center justify-center flex-shrink-0 mt-0.5 transition-colors">
                                        ${isSelected ? '<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : ''}
                                    </div>
                                    <span class="text-sm text-gray-300">${action.text}</span>
                                </div>
                            </button>
                            `;
                        }).join('')}
                    </div>
                </div>

                <!-- Bestaetigen -->
                <div class="text-center">
                    <button onclick="confirmActions()"
                        class="bg-red-600 hover:bg-red-500 text-white font-bold px-8 py-3 rounded-xl transition-all hover:scale-105 shadow-lg shadow-red-900/50 ${state.selectedActions.length === 0 ? 'opacity-50 cursor-not-allowed' : ''}"
                        ${state.selectedActions.length === 0 ? 'disabled' : ''}>
                        Massnahmen bestaetigen &#x27A1; Auswertung
                    </button>
                    <p class="text-xs text-gray-600 mt-2">${state.selectedActions.length} Massnahme${state.selectedActions.length !== 1 ? 'n' : ''} ausgewaehlt</p>
                </div>
            </div>
        `;
    }

    function renderFeedback() {
        const s = state.currentScenario;
        const triageCorrect = state.triageChoice === s.triage;
        const triagePoints = triageCorrect ? 30 : 0;

        let abcPoints = 0;
        state.abcAnswers.forEach((ansIdx, step) => {
            const steps = ['a', 'b', 'c'];
            if (s.abc[steps[step]].options[ansIdx].correct) abcPoints += 10;
        });

        let actionPoints = 0;
        state.selectedActions.forEach(idx => {
            actionPoints += s.immediateActions[idx].points;
        });
        // Penalty fuer nicht gewaehlte korrekte Aktionen
        s.immediateActions.forEach((action, idx) => {
            if (action.correct && !state.selectedActions.includes(idx)) {
                actionPoints -= Math.floor(action.points * 0.3);
            }
        });

        const timeBonus = Math.floor(state.timeLeft / TIMER_CONFIG[s.triage] * 20);
        const totalScenarioScore = Math.max(0, triagePoints + abcPoints + actionPoints + timeBonus);

        state.scenarioScore = totalScenarioScore;

        return `
            <div class="animate-slide-in">
                <!-- Score-Header -->
                <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-4 text-center">
                    <h2 class="text-2xl font-black text-white mb-2">Auswertung: ${s.title}</h2>
                    <div class="text-6xl font-black text-emerald-400 score-pop mb-2">${totalScenarioScore}</div>
                    <div class="text-sm text-gray-500">Punkte fuer dieses Szenario</div>

                    <!-- Score-Breakdown -->
                    <div class="grid grid-cols-4 gap-3 mt-4">
                        <div class="bg-gray-800/50 rounded-xl p-3">
                            <div class="text-xs text-gray-500">Triage</div>
                            <div class="text-lg font-bold ${triageCorrect ? 'text-emerald-400' : 'text-red-400'}">${triagePoints}P</div>
                        </div>
                        <div class="bg-gray-800/50 rounded-xl p-3">
                            <div class="text-xs text-gray-500">ABC</div>
                            <div class="text-lg font-bold text-blue-400">${abcPoints}P</div>
                        </div>
                        <div class="bg-gray-800/50 rounded-xl p-3">
                            <div class="text-xs text-gray-500">Massnahmen</div>
                            <div class="text-lg font-bold ${actionPoints >= 0 ? 'text-emerald-400' : 'text-red-400'}">${actionPoints}P</div>
                        </div>
                        <div class="bg-gray-800/50 rounded-xl p-3">
                            <div class="text-xs text-gray-500">Zeitbonus</div>
                            <div class="text-lg font-bold text-yellow-400">+${timeBonus}P</div>
                        </div>
                    </div>
                </div>

                <!-- Triage-Feedback -->
                <div class="bg-gray-900 border ${triageCorrect ? 'border-emerald-800' : 'border-red-800'} rounded-2xl p-5 mb-4">
                    <div class="flex items-center gap-2 mb-2">
                        <span>${triageCorrect ? '&#x2705;' : '&#x274C;'}</span>
                        <h3 class="font-bold ${triageCorrect ? 'text-emerald-400' : 'text-red-400'}">
                            Triage: ${triageCorrect ? 'Korrekt' : 'Falsch'}
                        </h3>
                    </div>
                    <p class="text-sm text-gray-400">
                        ${triageCorrect
                            ? `Richtig erkannt: ${s.triageLabel}`
                            : `Deine Wahl: ${getTriageLabel(state.triageChoice)} -- Korrekt waere: ${s.triageLabel}`
                        }
                    </p>
                </div>

                <!-- Massnahmen-Feedback -->
                <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 mb-4">
                    <h3 class="font-bold text-white mb-3">Massnahmen-Auswertung:</h3>
                    <div class="space-y-2">
                        ${s.immediateActions.map((action, i) => {
                            const wasSelected = state.selectedActions.includes(i);
                            const isCorrectAction = action.correct;
                            let statusClass, statusIcon;

                            if (wasSelected && isCorrectAction) {
                                statusClass = 'border-emerald-800 bg-emerald-950/20';
                                statusIcon = '&#x2705;';
                            } else if (wasSelected && !isCorrectAction) {
                                statusClass = 'border-red-800 bg-red-950/20';
                                statusIcon = '&#x274C;';
                            } else if (!wasSelected && isCorrectAction) {
                                statusClass = 'border-yellow-800 bg-yellow-950/20';
                                statusIcon = '&#x26A0;';
                            } else {
                                statusClass = 'border-gray-800 bg-gray-900/50';
                                statusIcon = '&#x2796;';
                            }

                            return `
                            <div class="border rounded-xl p-3 ${statusClass}">
                                <div class="flex items-start gap-2">
                                    <span class="mt-0.5">${statusIcon}</span>
                                    <div class="flex-1 min-w-0">
                                        <div class="text-sm text-gray-300 font-medium">${action.text}</div>
                                        <div class="text-xs text-gray-500 mt-1">${action.feedback}</div>
                                        <div class="text-xs font-mono mt-1 ${action.points > 0 ? 'text-emerald-500' : 'text-red-500'}">
                                            ${wasSelected ? (action.points > 0 ? '+' : '') + action.points + 'P' : isCorrectAction ? 'Nicht gewaehlt (-' + Math.floor(action.points * 0.3) + 'P)' : 'Korrekt nicht gewaehlt'}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>

                <!-- Optimale Vorgehensweise -->
                <div class="bg-gray-900 border border-emerald-900/50 rounded-2xl p-5 mb-4">
                    <h3 class="font-bold text-emerald-400 mb-3 flex items-center gap-2">
                        <span>&#x1F4D6;</span> Optimale Vorgehensweise
                    </h3>
                    <p class="text-sm text-gray-300 leading-relaxed">${s.optimalApproach}</p>
                </div>

                <!-- Weiter -->
                <div class="text-center">
                    <button onclick="nextScenario()"
                        class="bg-red-600 hover:bg-red-500 text-white font-bold px-8 py-3 rounded-xl transition-all hover:scale-105 shadow-lg shadow-red-900/50">
                        ${state.scenariosCompleted + 1 < SCENARIOS.length ? 'Naechstes Szenario' : 'Endergebnis anzeigen'} &#x27A1;
                    </button>
                </div>
            </div>
        `;
    }

    function renderResults() {
        const maxPossible = SCENARIOS.length * 150;
        const percentage = Math.round((state.totalScore / maxPossible) * 100);
        let grade, gradeColor, gradeText;

        if (percentage >= 90) { grade = 'Exzellent'; gradeColor = 'text-emerald-400'; gradeText = 'Du bist bereit fuer die Notaufnahme!'; }
        else if (percentage >= 75) { grade = 'Gut'; gradeColor = 'text-blue-400'; gradeText = 'Solide Grundlagen, einige Bereiche zum Vertiefen.'; }
        else if (percentage >= 60) { grade = 'Befriedigend'; gradeColor = 'text-yellow-400'; gradeText = 'Grundverstaendnis vorhanden, weiteres Training empfohlen.'; }
        else if (percentage >= 40) { grade = 'Ausbaufaehig'; gradeColor = 'text-orange-400'; gradeText = 'Die Notfallmedizin erfordert mehr Uebung.'; }
        else { grade = 'Kritisch'; gradeColor = 'text-red-400'; gradeText = 'Intensives Studium der Notfallprotokolle dringend empfohlen.'; }

        return `
            <div class="animate-slide-in">
                <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 mb-6 text-center">
                    <h2 class="text-3xl font-black text-white mb-4">Trainingsergebnis</h2>
                    <div class="text-7xl font-black ${gradeColor} score-pop mb-2">${state.totalScore}</div>
                    <div class="text-lg text-gray-400 mb-1">von ${maxPossible} moeglichen Punkten (${percentage}%)</div>
                    <div class="text-2xl font-bold ${gradeColor} mb-2">${grade}</div>
                    <p class="text-sm text-gray-500">${gradeText}</p>
                </div>

                <!-- Einzelergebnisse -->
                <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-6">
                    <h3 class="text-lg font-bold text-white mb-4">Einzelergebnisse</h3>
                    <div class="space-y-2">
                        ${state.scenarioResults.map(r => {
                            const s = SCENARIOS.find(sc => sc.id === r.id);
                            return `
                            <div class="flex items-center gap-3 bg-gray-800/50 rounded-xl p-3">
                                <span class="text-2xl">${s.icon}</span>
                                <div class="flex-1 min-w-0">
                                    <div class="text-sm font-semibold text-white truncate">${s.title}</div>
                                    <div class="text-xs text-gray-500">${r.triageCorrect ? 'Triage korrekt' : 'Triage falsch'}</div>
                                </div>
                                <span class="triage-${s.triage} text-xs font-bold px-2 py-0.5 rounded-full text-white border">${s.triageLabel.split(' ')[0]}</span>
                                <span class="text-lg font-bold font-mono ${r.score >= 80 ? 'text-emerald-400' : r.score >= 40 ? 'text-yellow-400' : 'text-red-400'}">${r.score}P</span>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>

                <div class="text-center">
                    <button onclick="resetGame()"
                        class="bg-red-600 hover:bg-red-500 text-white font-bold px-8 py-3 rounded-xl transition-all hover:scale-105 shadow-lg shadow-red-900/50">
                        Erneut trainieren
                    </button>
                    <a href="vetscan-version-selector.html"
                       class="block mt-3 text-sm text-gray-500 hover:text-gray-300 transition-colors">
                        Zurueck zur Uebersicht
                    </a>
                </div>
            </div>
        `;
    }

    function renderTimerBar(s) {
        return `
            <div class="bg-gray-900 border ${state.timeLeft <= 30 ? 'border-red-600 pulse-border' : 'border-gray-700'} rounded-xl p-3 mb-4">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-xs font-semibold text-gray-500">Zeit</span>
                    <span class="text-lg font-mono font-bold ${state.timeLeft <= 30 ? 'timer-critical' : 'text-white'}">${formatTime(state.timeLeft)}</span>
                </div>
                <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden">
                    <div class="h-full rounded-full progress-fill ${state.timeLeft <= 30 ? 'bg-red-500' : state.timeLeft <= 60 ? 'bg-yellow-500' : 'bg-emerald-500'}"
                         style="width: ${(state.timeLeft / TIMER_CONFIG[s.triage]) * 100}%"></div>
                </div>
            </div>
        `;
    }

    // ==========================================
    // GAME-LOGIK
    // ==========================================

    function startGame() {
        // Naechstes nicht abgeschlossenes Szenario finden
        const completedIds = state.scenarioResults.map(r => r.id);
        const nextScenario = SCENARIOS.find(s => !completedIds.includes(s.id));

        if (!nextScenario) {
            state.currentView = 'results';
            render();
            return;
        }

        state.currentScenario = nextScenario;
        state.triageChoice = null;
        state.abcStep = 0;
        state.abcAnswers = [];
        state.selectedActions = [];
        state.scenarioScore = 0;
        state.timeLeft = TIMER_CONFIG[nextScenario.triage];
        state.startTime = Date.now();
        state.currentView = 'scenario';

        startTimer();
        render();
    }

    function startTimer() {
        if (state.timer) clearInterval(state.timer);
        state.timer = setInterval(() => {
            state.timeLeft--;
            if (state.timeLeft <= 0) {
                state.timeLeft = 0;
                clearInterval(state.timer);
                // Zeitablauf: Automatisch zur Auswertung
                if (state.currentView !== 'feedback') {
                    if (state.currentView === 'triage' && !state.triageChoice) {
                        state.triageChoice = 'green'; // Default bei Zeitablauf
                    }
                    if (state.currentView === 'abc' || state.currentView === 'triage') {
                        // Fehlende ABC-Antworten auffuellen
                        while (state.abcAnswers.length < 3) {
                            state.abcAnswers.push(0);
                        }
                    }
                    state.currentView = 'feedback';
                    render();
                }
            }
            // Timer-Anzeige aktualisieren (nur Timer-Elemente)
            updateTimerDisplay();
        }, 1000);
    }

    function stopTimer() {
        if (state.timer) {
            clearInterval(state.timer);
            state.timer = null;
        }
    }

    function updateTimerDisplay() {
        const timerElements = document.querySelectorAll('.font-mono.font-bold');
        timerElements.forEach(el => {
            if (el.id !== 'header-score') {
                el.textContent = formatTime(state.timeLeft);
                if (state.timeLeft <= 30) {
                    el.classList.add('timer-critical');
                }
            }
        });
        // Progress-Bar aktualisieren
        const progressBars = document.querySelectorAll('.progress-fill');
        progressBars.forEach(bar => {
            if (state.currentScenario) {
                const pct = (state.timeLeft / TIMER_CONFIG[state.currentScenario.triage]) * 100;
                bar.style.width = pct + '%';
                bar.className = `h-full rounded-full progress-fill ${state.timeLeft <= 30 ? 'bg-red-500' : state.timeLeft <= 60 ? 'bg-yellow-500' : 'bg-emerald-500'}`;
            }
        });
    }

    function goToTriage() {
        state.currentView = 'triage';
        render();
    }

    function selectTriage(choice) {
        state.triageChoice = choice;
        render();
    }

    function confirmTriage() {
        if (!state.triageChoice) return;
        state.abcStep = 0;
        state.abcAnswers = [];
        state.currentView = 'abc';
        render();
    }

    function selectABCAnswer(optionIndex) {
        state.abcAnswers.push(optionIndex);
        renderABCFeedback(optionIndex);
    }

    function nextABCStep() {
        if (state.abcStep < 2) {
            state.abcStep++;
            state.currentView = 'abc';
        } else {
            state.currentView = 'actions';
        }
        render();
    }

    function toggleAction(index) {
        const idx = state.selectedActions.indexOf(index);
        if (idx > -1) {
            state.selectedActions.splice(idx, 1);
        } else {
            state.selectedActions.push(index);
        }
        render();
    }

    function confirmActions() {
        if (state.selectedActions.length === 0) return;
        stopTimer();

        // Score berechnen
        const s = state.currentScenario;
        const triageCorrect = state.triageChoice === s.triage;
        const triagePoints = triageCorrect ? 30 : 0;

        let abcPoints = 0;
        state.abcAnswers.forEach((ansIdx, step) => {
            const steps = ['a', 'b', 'c'];
            if (s.abc[steps[step]].options[ansIdx].correct) abcPoints += 10;
        });

        let actionPoints = 0;
        state.selectedActions.forEach(idx => {
            actionPoints += s.immediateActions[idx].points;
        });
        s.immediateActions.forEach((action, idx) => {
            if (action.correct && !state.selectedActions.includes(idx)) {
                actionPoints -= Math.floor(action.points * 0.3);
            }
        });

        const timeBonus = Math.floor(state.timeLeft / TIMER_CONFIG[s.triage] * 20);
        const totalScenarioScore = Math.max(0, triagePoints + abcPoints + actionPoints + timeBonus);

        state.scenarioScore = totalScenarioScore;
        state.totalScore += totalScenarioScore;
        state.scenarioResults.push({
            id: s.id,
            score: totalScenarioScore,
            triageCorrect: triageCorrect,
            timeUsed: TIMER_CONFIG[s.triage] - state.timeLeft
        });

        state.currentView = 'feedback';
        render();
    }

    function nextScenario() {
        state.scenariosCompleted++;

        const completedIds = state.scenarioResults.map(r => r.id);
        const hasMore = SCENARIOS.some(s => !completedIds.includes(s.id));

        if (!hasMore) {
            state.currentView = 'results';
        } else {
            state.currentView = 'menu';
        }
        render();
    }

    function resetGame() {
        state.currentView = 'menu';
        state.currentScenario = null;
        state.scenarioIndex = 0;
        state.abcStep = 0;
        state.abcAnswers = [];
        state.selectedActions = [];
        state.triageChoice = null;
        state.totalScore = 0;
        state.scenarioScore = 0;
        state.scenariosCompleted = 0;
        state.scenarioResults = [];
        stopTimer();
        render();
    }

    // ==========================================
    // HILFSFUNKTIONEN
    // ==========================================

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function getTriageLabel(triage) {
        const labels = {
            red: 'ROT -- Sofort',
            orange: 'ORANGE -- Dringend',
            yellow: 'GELB -- Bald',
            green: 'GRUEN -- Warten'
        };
        return labels[triage] || triage;
    }

    // ==========================================
    // INIT
    // ==========================================

    render();

    </script>
</body>
</html>
