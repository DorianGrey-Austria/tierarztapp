<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetScan Pro - Pathologie-Fallstudien</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        :root {
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --primary-dark: #1e3a5f;
            --accent: #059669;
            --accent-light: #34d399;
            --danger: #dc2626;
            --warning: #f59e0b;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #334155;
            --success: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }

        .card-glass {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.6);
        }

        .step-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .step-card:hover {
            border-color: var(--primary-light);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
        }

        .step-active {
            border-color: var(--primary-light);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.15);
        }

        .step-completed {
            border-color: var(--success);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-success {
            background: linear-gradient(135deg, #059669, #34d399);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .badge-blue { background: rgba(59, 130, 246, 0.15); color: #93c5fd; }
        .badge-green { background: rgba(34, 197, 94, 0.15); color: #86efac; }
        .badge-orange { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }
        .badge-red { background: rgba(220, 38, 38, 0.15); color: #fca5a5; }
        .badge-purple { background: rgba(139, 92, 246, 0.15); color: #c4b5fd; }
        .badge-teal { background: rgba(20, 184, 166, 0.15); color: #5eead4; }

        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 14px 18px;
            margin-bottom: 10px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            line-height: 1.5;
        }

        .option-btn:hover {
            border-color: var(--primary-light);
            background: rgba(59, 130, 246, 0.05);
        }

        .option-btn.selected {
            border-color: var(--primary-light);
            background: rgba(59, 130, 246, 0.1);
        }

        .option-btn.correct {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .option-btn.incorrect {
            border-color: var(--danger);
            background: rgba(220, 38, 38, 0.1);
        }

        .progress-bar {
            height: 6px;
            background: var(--bg-card-hover);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .stepper {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-bottom: 32px;
        }

        .stepper::before {
            content: '';
            position: absolute;
            top: 18px;
            left: 10%;
            right: 10%;
            height: 2px;
            background: var(--border);
        }

        .stepper-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            cursor: default;
            flex: 1;
        }

        .stepper-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .stepper-step.active .stepper-circle {
            background: var(--primary);
            border-color: var(--primary-light);
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .stepper-step.completed .stepper-circle {
            background: var(--accent);
            border-color: var(--accent-light);
            color: white;
        }

        .stepper-label {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            font-weight: 500;
        }

        .stepper-step.active .stepper-label {
            color: var(--primary-light);
        }

        .stepper-step.completed .stepper-label {
            color: var(--accent-light);
        }

        .info-box {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .warning-box {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .success-box {
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .danger-box {
            background: rgba(220, 38, 38, 0.08);
            border: 1px solid rgba(220, 38, 38, 0.2);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .case-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .case-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .case-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary-light);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .case-card:hover::before {
            opacity: 1;
        }

        .case-card.completed-case {
            border-color: rgba(34, 197, 94, 0.3);
        }

        .case-card.completed-case::before {
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            opacity: 1;
        }

        .difficulty-dots {
            display: flex;
            gap: 4px;
        }

        .difficulty-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
        }

        .difficulty-dot.filled {
            background: var(--warning);
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse-glow {
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 5px rgba(59, 130, 246, 0.2); }
            50% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        }

        .lab-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 8px;
            overflow: hidden;
        }

        .lab-table th {
            background: rgba(30, 64, 175, 0.2);
            padding: 10px 14px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .lab-table td {
            padding: 10px 14px;
            border-top: 1px solid var(--border);
            font-size: 14px;
        }

        .lab-table tr:nth-child(even) td {
            background: rgba(15, 23, 42, 0.3);
        }

        .lab-value-high {
            color: #fca5a5;
            font-weight: 600;
        }

        .lab-value-low {
            color: #93c5fd;
            font-weight: 600;
        }

        .lab-value-normal {
            color: var(--text-primary);
        }

        .lab-value-critical {
            color: #f87171;
            font-weight: 700;
        }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
        }

        .filter-chip:hover {
            border-color: var(--primary-light);
            color: var(--text-primary);
        }

        .filter-chip.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--primary-light);
            color: var(--primary-light);
        }

        .score-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .score-ring svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .score-ring circle {
            fill: none;
            stroke-width: 6;
        }

        .score-ring .bg-ring {
            stroke: var(--border);
        }

        .score-ring .score-arc {
            stroke: var(--success);
            stroke-linecap: round;
            transition: stroke-dashoffset 1s ease;
        }

        @media (max-width: 768px) {
            .stepper-label { font-size: 9px; }
            .stepper-circle { width: 30px; height: 30px; font-size: 12px; }
        }

        .scroll-y {
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .scroll-y::-webkit-scrollbar {
            width: 6px;
        }

        .scroll-y::-webkit-scrollbar-track {
            background: transparent;
        }

        .scroll-y::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }

      /* Accessibility: Focus styles */
      :focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; border-radius: 4px; }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }

</style>
</head>

<script>

    selectedDiagnose: null,

    answeredSteps: [],
    score: 0,
    maxScore: 0,
    completedCases: JSON.parse(localStorage.getItem('pathoCases_completed') || '{}'),

const STEPS = [
    { label: "Anamnese", icon: "1" },

const CATEGORIES = [

function render() {
    const app = document.getElementById('app');
    switch (state.screen) {
        case 'overview': app.innerHTML = renderOverview(); break;
        case 'case': app.innerHTML = renderCase(); break;
        case 'summary': app.innerHTML = renderSummary(); break;
    }
    bindEvents();
}

function renderOverview() {
    const filteredCases = CASES.filter(c => {
        const catMatch = state.activeFilter === 'all' || c.category === state.activeFilter;
        const diffMatch = state.activeDifficulty === 'all' || c.difficulty === parseInt(state.activeDifficulty);
        return catMatch && diffMatch;
    });

    const totalCompleted = Object.keys(state.completedCases).length;
    const totalCases = CASES.length;
    const avgScore = totalCompleted > 0
        ? Math.round(Object.values(state.caseScores).reduce((a,b) => a+b, 0) / totalCompleted)
        : 0;

    return `
    <div class="max-w-6xl mx-auto px-4 py-6 fade-in">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <a href="vetscan-version-selector.html" class="text-sm text-blue-400 hover:text-blue-300 flex items-center gap-1 mb-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    Zurueck zur Versionauswahl
                </a>
                <h1 class="text-3xl font-bold">Pathologie-Fallstudien</h1>
                <p class="text-slate-400 mt-1">Fallbasiertes Lernen mit realistischen klinischen Szenarien</p>
            </div>
            <div class="flex gap-4">
                <div class="text-center">
                    <div class="stat-value">${totalCompleted}/${totalCases}</div>
                    <div class="text-xs text-slate-400">Faelle abgeschlossen</div>
                </div>
                <div class="text-center">
                    <div class="stat-value">${avgScore}%</div>
                    <div class="text-xs text-slate-400">Durchschn. Score</div>
                </div>
            </div>
        </div>

        <!-- Progress -->
        <div class="mb-6">
            <div class="progress-bar">
                <div class="progress-fill" style="width: ${(totalCompleted / totalCases) * 100}%"></div>
            </div>
            <div class="text-xs text-slate-500 mt-1">${Math.round((totalCompleted / totalCases) * 100)}% abgeschlossen</div>
        </div>

        <!-- Filters -->
        <div class="mb-6">
            <div class="flex flex-wrap gap-2 mb-3">
                ${CATEGORIES.map(cat => `
                    <button class="filter-chip ${state.activeFilter === cat.id ? 'active' : ''}" data-filter="${cat.id}">
                        ${cat.label}
                    </button>
                `).join('')}
            </div>
            <div class="flex gap-2">
                <button class="filter-chip ${state.activeDifficulty === 'all' ? 'active' : ''}" data-difficulty="all">Alle Stufen</button>
                <button class="filter-chip ${state.activeDifficulty === '1' ? 'active' : ''}" data-difficulty="1">Leicht</button>
                <button class="filter-chip ${state.activeDifficulty === '2' ? 'active' : ''}" data-difficulty="2">Mittel</button>
                <button class="filter-chip ${state.activeDifficulty === '3' ? 'active' : ''}" data-difficulty="3">Schwer</button>
            </div>
        </div>

        <!-- Cases Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${filteredCases.map(c => renderCaseCard(c)).join('')}
        </div>

        ${filteredCases.length === 0 ? '<p class="text-center text-slate-500 mt-8">Keine Faelle fuer diesen Filter gefunden.</p>' : ''}

        <!-- Footer -->
        <div class="mt-12 text-center text-xs text-slate-600">
            VetScan Pro -- Pathologie-Fallstudien | Nur fuer Lernzwecke
        </div>
    </div>`;
}

function renderCaseCard(c) {
    const isCompleted = state.completedCases[c.id];
    const score = state.caseScores[c.id];
    const catColors = {
        'innere-hund': 'badge-blue',
        'innere-katze': 'badge-purple',
        'chirurgie': 'badge-red',
        'pferd': 'badge-orange',
        'dermatologie': 'badge-teal',
        'exoten': 'badge-green'
    };

    return `
    <div class="case-card ${isCompleted ? 'completed-case' : ''}" data-case-id="${c.id}">
        <div class="flex items-start justify-between mb-3">
            <span class="text-2xl">${c.speciesIcon}</span>
            <div class="flex items-center gap-2">
                ${c.emergency ? '<span class="badge badge-red">NOTFALL</span>' : ''}
                <span class="badge ${catColors[c.category] || 'badge-blue'}">${c.categoryLabel}</span>
            </div>
        </div>
        <h3 class="font-semibold text-base mb-2">${c.title}</h3>
        <p class="text-sm text-slate-400 mb-3">${c.signalment.rasse}, ${c.signalment.alter}, ${c.signalment.geschlecht}</p>
        <div class="flex items-center justify-between">
            <div class="difficulty-dots" title="Schwierigkeit: ${c.difficulty}/3">
                ${[1,2,3].map(d => `<div class="difficulty-dot ${d <= c.difficulty ? 'filled' : ''}"></div>`).join('')}
            </div>
            ${isCompleted
                ? `<span class="text-xs text-emerald-400 font-semibold">${score}% Score</span>`
                : '<span class="text-xs text-slate-500">Noch nicht bearbeitet</span>'
            }
        </div>
    </div>`;
}

    return `

                Zurueck

            <div class="flex items-center gap-3">

        <div class="mb-6">

            ${renderStepContent(c, step)}
        </div>

        <!-- Navigation -->
        <div class="flex justify-between mt-6">
            <button class="btn-secondary" id="btn-prev" ${step === 0 ? 'disabled style="opacity:0.3;pointer-events:none"' : ''}>

            </button>
            ${step < 4
                ? `<button class="btn-primary" id="btn-next" ${!state.answeredSteps.includes(step) ? 'disabled' : ''}>
                    Naechster Schritt
                   </button>`
                : `<button class="btn-success" id="btn-finish" ${!state.answeredSteps.includes(step) ? 'disabled' : ''}>
                    Fallzusammenfassung
                   </button>`
            }
        </div>
    </div>`;
}

function renderStepContent(c, step) {
    switch (step) {
        case 0: return renderAnamnese(c);
        case 1: return renderUntersuchung(c);
        case 2: return renderDiagnostik(c);
        case 3: return renderDiagnose(c);
        case 4: return renderTherapie(c);
    }
}

function renderSummary() {
    const c = state.currentCase;
    const pct = state.maxScore > 0 ? Math.round((state.score / state.maxScore) * 100) : 0;

    if (typeof VetScan !== 'undefined' && VetScan.saveScore) {
        VetScan.saveScore('pathology-cases', state.score, state.maxScore);
    }
    const circumference = 2 * Math.PI * 52;
    const dashOffset = circumference - (pct / 100) * circumference;

    let scoreColor = '#22c55e';
    if (pct < 50) scoreColor = '#dc2626';
    else if (pct < 75) scoreColor = '#f59e0b';

    return `
    <div class="max-w-4xl mx-auto px-4 py-6 fade-in">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold mb-2">Fallzusammenfassung</h2>
            <p class="text-slate-400">${c.title}</p>
        </div>

        <!-- Score -->
        <div class="flex justify-center mb-8">
            <div class="score-ring">
                <svg viewBox="0 0 120 120">
                    <circle class="bg-ring" cx="60" cy="60" r="52"/>
                    <circle class="score-arc" cx="60" cy="60" r="52"
                        stroke="${scoreColor}"
                        stroke-dasharray="${circumference}"
                        stroke-dashoffset="${dashOffset}"/>
                </svg>
                <div class="text-center">
                    <div class="text-3xl font-bold" style="color: ${scoreColor}">${pct}%</div>
                    <div class="text-xs text-slate-400">${state.score}/${state.maxScore} Pkt.</div>
                </div>
            </div>
        </div>

        <div class="text-center mb-6">
            ${pct >= 90
                ? '<span class="badge badge-green text-base px-4 py-1">Hervorragend!</span>'
                : pct >= 75
                    ? '<span class="badge badge-blue text-base px-4 py-1">Gut gemacht!</span>'
                    : pct >= 50
                        ? '<span class="badge badge-orange text-base px-4 py-1">Solide Leistung</span>'
                        : '<span class="badge badge-red text-base px-4 py-1">Wiederholung empfohlen</span>'
            }
        </div>

        <!-- Zusammenfassung -->
        <div class="step-card p-6 mb-6">
            <h3 class="text-base font-semibold mb-3">Klinische Zusammenfassung</h3>
            <p class="text-sm text-slate-300 leading-relaxed">${c.zusammenfassung}</p>
        </div>

        <!-- Lernziele -->
        <div class="step-card p-6 mb-6">
            <h3 class="text-base font-semibold mb-3">Lernziele dieses Falls</h3>
            <ul class="space-y-2">
                ${c.lernziele.map(lz => `
                    <li class="flex items-start gap-2 text-sm">
                        <svg class="w-4 h-4 text-blue-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4"/></svg>
                        <span class="text-slate-300">${lz}</span>
                    </li>
                `).join('')}
            </ul>
        </div>

        <!-- Buttons -->
        <div class="flex justify-center gap-4 mt-8">
            <button class="btn-secondary" id="btn-retry">
                Fall wiederholen
            </button>
            <button class="btn-primary" id="btn-overview">
                Zurueck zur Falluebersicht
            </button>
        </div>
    </div>`;
}

// ============================================================
// SCORING
// ============================================================
function calculateScore() {
    const c = state.currentCase;
    let score = 0;
    let maxScore = 0;

    // Diagnostik (each correct selection = +2, each incorrect = -1)
    const correctDiag = c.diagnostikOptionen.filter(o => o.correct);
    const incorrectDiag = c.diagnostikOptionen.filter(o => !o.correct);
    maxScore += correctDiag.length * 2;

    correctDiag.forEach(o => {
        if (state.selectedDiagnostik.includes(o.id)) score += 2;
    });
    incorrectDiag.forEach(o => {
        if (state.selectedDiagnostik.includes(o.id)) score -= 1;
    });

    // Diagnose (+5 if correct)
    maxScore += 5;
    const correctDiagnose = c.diagnoseOptionen.find(o => o.correct);
    if (state.selectedDiagnose === correctDiagnose?.id) score += 5;

    // Therapie (each correct = +2, incorrect = -1)
    const correctTher = c.therapieOptionen.filter(o => o.correct);
    const incorrectTher = c.therapieOptionen.filter(o => !o.correct);
    maxScore += correctTher.length * 2;

    correctTher.forEach(o => {
        if (state.selectedTherapie.includes(o.id)) score += 2;
    });
    incorrectTher.forEach(o => {
        if (state.selectedTherapie.includes(o.id)) score -= 1;
    });

    // Minimum 0
    score = Math.max(0, score);

    state.score = score;
    state.maxScore = maxScore;
}

// EVENT BINDING
// ============================================================
function bindEvents() {
    // Overview: Filter chips
    document.querySelectorAll('[data-filter]').forEach(el => {
        el.addEventListener('click', () => {
            state.activeFilter = el.dataset.filter;
            render();
        });
    });

    document.querySelectorAll('[data-difficulty]').forEach(el => {
        el.addEventListener('click', () => {
            state.activeDifficulty = el.dataset.difficulty;
            render();
        });
    });

    // Overview: Case cards
    document.querySelectorAll('[data-case-id]').forEach(el => {
        el.addEventListener('click', () => {
            const caseId = parseInt(el.dataset.caseId);
            startCase(caseId);
        });
    });

    // Case: Back button
    const btnBack = document.getElementById('btn-back');
    if (btnBack) {
        btnBack.addEventListener('click', () => {
            state.screen = 'overview';
            render();
        });
    }

    // Case: Navigation
    const btnPrev = document.getElementById('btn-prev');
    if (btnPrev) {
        btnPrev.addEventListener('click', () => {
            if (state.currentStep > 0) {
                state.currentStep--;
                render();
            }
        });
    }

    const btnNext = document.getElementById('btn-next');
    if (btnNext) {
        btnNext.addEventListener('click', () => {
            if (state.currentStep < 4 && state.answeredSteps.includes(state.currentStep)) {
                state.currentStep++;
                render();
            }
        });
    }

    const btnFinish = document.getElementById('btn-finish');
    if (btnFinish) {
        btnFinish.addEventListener('click', () => {
            calculateScore();
            const pct = state.maxScore > 0 ? Math.round((state.score / state.maxScore) * 100) : 0;
            state.completedCases[state.currentCase.id] = true;
            state.caseScores[state.currentCase.id] = pct;
            localStorage.setItem('pathoCases_completed', JSON.stringify(state.completedCases));
            localStorage.setItem('pathoCases_scores', JSON.stringify(state.caseScores));
            state.screen = 'summary';
            render();
        });
    }

    // Step: Anamnese
    document.querySelectorAll('.frage-toggle').forEach(el => {
        el.addEventListener('click', () => {
            const idx = el.dataset.frage;
            const content = document.querySelector(`[data-frage-content="${idx}"]`);
            if (content) content.classList.toggle('hidden');
        });
    });

    const btnAnamneseDone = document.getElementById('btn-anamnese-done');
    if (btnAnamneseDone) {
        btnAnamneseDone.addEventListener('click', () => {
            state.answeredSteps.push(0);
            render();
        });
    }

    // Step: Untersuchung
    document.querySelectorAll('.befund-card').forEach(el => {
        el.addEventListener('click', () => {
            if (state.answeredSteps.includes(1)) return;
            const idx = el.dataset.befund;
            const val = document.querySelector(`[data-befund-value="${idx}"]`);
            const ph = document.querySelector(`[data-befund-placeholder="${idx}"]`);
            if (val) val.classList.remove('hidden');
            if (ph) ph.classList.add('hidden');
        });
    });

    const btnUntersuchungDone = document.getElementById('btn-untersuchung-done');
    if (btnUntersuchungDone) {
        btnUntersuchungDone.addEventListener('click', () => {
            state.answeredSteps.push(1);
            render();
        });
    }

    // Step: Diagnostik
    document.querySelectorAll('[data-diagnostik]').forEach(el => {
        el.addEventListener('click', () => {
            if (state.answeredSteps.includes(2)) return;
            const id = el.dataset.diagnostik;
            const idx = state.selectedDiagnostik.indexOf(id);
            if (idx >= 0) state.selectedDiagnostik.splice(idx, 1);
            else state.selectedDiagnostik.push(id);
            render();
        });
    });

    const btnDiagnostikDone = document.getElementById('btn-diagnostik-done');
    if (btnDiagnostikDone) {
        btnDiagnostikDone.addEventListener('click', () => {
            state.answeredSteps.push(2);
            render();
        });
    }

    // Step: Diagnose
    document.querySelectorAll('[data-diagnose]').forEach(el => {
        el.addEventListener('click', () => {
            if (state.answeredSteps.includes(3)) return;
            state.selectedDiagnose = el.dataset.diagnose;
            render();
        });
    });

    const btnDiagnoseDone = document.getElementById('btn-diagnose-done');
    if (btnDiagnoseDone) {
        btnDiagnoseDone.addEventListener('click', () => {
            state.answeredSteps.push(3);
            render();
        });
    }

    // Step: Therapie
    document.querySelectorAll('[data-therapie]').forEach(el => {
        el.addEventListener('click', () => {
            if (state.answeredSteps.includes(4)) return;
            const id = el.dataset.therapie;
            const idx = state.selectedTherapie.indexOf(id);
            if (idx >= 0) state.selectedTherapie.splice(idx, 1);
            else state.selectedTherapie.push(id);
            render();
        });
    });

    const btnTherapieDone = document.getElementById('btn-therapie-done');
    if (btnTherapieDone) {
        btnTherapieDone.addEventListener('click', () => {
            state.answeredSteps.push(4);
            render();
        });
    }

    // Summary buttons
    const btnRetry = document.getElementById('btn-retry');
    if (btnRetry) {
        btnRetry.addEventListener('click', () => {
            startCase(state.currentCase.id);
        });
    }

    const btnOverview = document.getElementById('btn-overview');
    if (btnOverview) {
        btnOverview.addEventListener('click', () => {
            state.screen = 'overview';
            render();
        });
    }
}

// ============================================================
// CASE MANAGEMENT
// ============================================================
function startCase(caseId) {
    const c = CASES.find(c => c.id === caseId);
    if (!c) return;
    state.currentCase = c;
    state.currentStep = 0;
    state.selectedDiagnostik = [];
    state.selectedDiagnose = null;
    state.selectedTherapie = [];
    state.answeredSteps = [];
    state.score = 0;
    state.maxScore = 0;
    state.screen = 'case';
    window.scrollTo(0, 0);
    render();
}

// ============================================================
// INIT
// ============================================================
render();
</script>
