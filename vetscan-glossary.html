<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetScan Glossar - Veterinaermedizinisches Woerterbuch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vet: {
                            primary: '#667eea',
                            secondary: '#764ba2',
                            accent: '#00d4aa',
                            dark: '#1a1a2e',
                            surface: '#16213e',
                            card: '#0f3460',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            color: #e0e0e0;
        }

        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* A-Z Navigation */
        .az-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
        }
        .az-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.6);
            min-height: 36px;
        }
        .az-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            color: #818cf8;
            border-color: rgba(102, 126, 234, 0.4);
        }
        .az-btn.active {
            background: rgba(102, 126, 234, 0.3);
            color: #a5b4fc;
            border-color: rgba(102, 126, 234, 0.5);
        }
        .az-btn.disabled {
            opacity: 0.3;
            cursor: default;
            pointer-events: none;
        }

        /* Category Tabs */
        .cat-tab {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.6);
            white-space: nowrap;
            min-height: 44px;
            display: flex;
            align-items: center;
        }
        .cat-tab:hover {
            background: rgba(102, 126, 234, 0.15);
            color: #a5b4fc;
        }
        .cat-tab.active {
            background: rgba(102, 126, 234, 0.25);
            color: #a5b4fc;
            border-color: rgba(102, 126, 234, 0.4);
        }

        /* Entry Card */
        .entry-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .entry-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(102, 126, 234, 0.3);
            transform: translateY(-1px);
        }
        .entry-card.expanded {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(102, 126, 234, 0.4);
        }
        .entry-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.25s ease;
            opacity: 0;
        }
        .entry-card.expanded .entry-details {
            max-height: 600px;
            opacity: 1;
        }

        /* Favorite Star */
        .fav-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 18px;
            color: rgba(255,255,255,0.2);
            transition: all 0.2s;
            border-radius: 8px;
            min-height: 36px;
            flex-shrink: 0;
        }
        .fav-btn:hover {
            color: #fbbf24;
            background: rgba(251,191,36,0.1);
        }
        .fav-btn.favorited {
            color: #fbbf24;
        }

        /* Category Badge */
        .cat-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        /* Letter heading */
        .letter-heading {
            font-size: 28px;
            font-weight: 800;
            color: #818cf8;
            padding: 16px 0 8px 4px;
            border-bottom: 2px solid rgba(129, 140, 248, 0.2);
            margin-bottom: 12px;
            scroll-margin-top: 200px;
        }

        /* Search highlight */
        mark {
            background: rgba(251, 191, 36, 0.3);
            color: inherit;
            border-radius: 2px;
            padding: 0 1px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

        /* Stats counter animation */
        @keyframes countUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stat-num { animation: countUp 0.4s ease-out; }

        @media print {
            body { background: #fff !important; color: #000 !important; }
            .glass, .glass-strong { background: #fff !important; border-color: #ccc !important; backdrop-filter: none !important; }
            .entry-card { background: #fff !important; border-color: #ddd !important; page-break-inside: avoid; }
            .entry-details { max-height: none !important; opacity: 1 !important; }
            .az-bar, .cat-tab, .fav-btn, #searchInput, #randomBtn, #favFilterBtn { display: none !important; }
            .letter-heading { color: #333 !important; }
        }
    </style>
</head>
<body>

<!-- Header -->
<header class="glass-strong sticky top-0 z-50" style="padding-top: 48px;">
    <div class="max-w-6xl mx-auto px-4 py-4">
        <div class="flex flex-col gap-4">
            <!-- Title Row -->
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-white">Veterinaermedizinisches Glossar</h1>
                    <p class="text-sm text-gray-400 mt-1" id="statsLine">Lade Eintraege...</p>
                </div>
                <div class="flex gap-2">
                    <button id="favFilterBtn" class="cat-tab text-sm" onclick="toggleFavFilter()" title="Nur Favoriten anzeigen">
                        Favoriten
                    </button>
                    <button id="randomBtn" class="cat-tab text-sm" onclick="showRandomEntry()" title="Zufaelliger Begriff">
                        Zufall
                    </button>
                </div>
            </div>

            <!-- Search -->
            <div class="relative">
                <input id="searchInput" type="text" placeholder="Suchbegriff eingeben..."
                    class="w-full px-4 py-3 pl-12 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-400/50 focus:ring-2 focus:ring-indigo-400/20 text-base"
                    autocomplete="off" spellcheck="false">
                <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <span id="searchCount" class="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-gray-500 hidden"></span>
            </div>

            <!-- Category Filter -->
            <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide" id="categoryBar" style="scrollbar-width:none;">
                <!-- Tabs werden dynamisch eingefuegt -->
            </div>

            <!-- A-Z Bar -->
            <div class="az-bar" id="azBar">
                <!-- Buttons werden dynamisch eingefuegt -->
            </div>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-6xl mx-auto px-4 py-6" id="glossaryContent">
    <!-- Eintraege werden dynamisch eingefuegt -->
</main>

<!-- Scroll-to-top -->
<button id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})"
    class="fixed bottom-6 right-6 w-12 h-12 rounded-full glass-strong text-white flex items-center justify-center text-xl cursor-pointer transition-all hover:scale-110 z-40 opacity-0 pointer-events-none"
    aria-label="Nach oben scrollen" style="transition: opacity 0.3s;">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
</button>

<script>
// =====================================================
// GLOSSAR-DATENBANK (120+ Eintraege)
// =====================================================
const GLOSSARY = [

// =====================================================
// ANATOMIE (20)
// =====================================================
{
    term: "Abdomen",
    pronunciation: "Ab-do-men",
    category: "Anatomie",
    definition: "Bauchhoehle; der Koerperabschnitt zwischen Thorax (Brustkorb) und Becken, der die Organe des Verdauungs-, Harn- und Genitaltrakts enthaelt.",
    synonyms: ["Bauchhoehle", "Cavum abdominis"],
    relevance: "Zentrale Region bei der klinischen Untersuchung. Palpation des Abdomens ist essenziell zur Beurteilung von Organgroessen, Schmerzhaftigkeit und Umfangsvermehrungen."
},
{
    term: "Thorax",
    pronunciation: "Tho-rax",
    category: "Anatomie",
    definition: "Brustkorb; der von Rippen, Brustwirbelsaeule und Sternum begrenzte Koerperabschnitt, der Herz und Lungen beherbergt.",
    synonyms: ["Brustkorb", "Cavum thoracis"],
    relevance: "Auskultation und Perkussion des Thorax sind Grundpfeiler der kardiopulmonalen Diagnostik."
},
{
    term: "Cranial",
    pronunciation: "Kra-ni-al",
    category: "Anatomie",
    definition: "Kopfwaerts gerichtet; in Richtung des Schaedels (Cranium). Gegenteil: caudal.",
    synonyms: ["Rostral (am Kopf selbst)"],
    relevance: "Standardisierte Lagebezeichnung in der veterinaermedizinischen Dokumentation und Bildgebung."
},
{
    term: "Caudal",
    pronunciation: "Kau-dal",
    category: "Anatomie",
    definition: "Schwanzwaerts gerichtet; in Richtung des Schwanzes (Cauda). Gegenteil: cranial.",
    synonyms: [],
    relevance: "Wird in Befundberichten und chirurgischen Protokollen zur exakten Lagebeschreibung verwendet."
},
{
    term: "Dorsal",
    pronunciation: "Dor-sal",
    category: "Anatomie",
    definition: "Rueckenwaerts gerichtet; zur Rueckenseite (Dorsum) hin gelegen. Gegenteil: ventral.",
    synonyms: [],
    relevance: "Wichtig fuer die Orientierung bei Roentgenaufnahmen (z.B. dorsoventral = DV-Aufnahme)."
},
{
    term: "Ventral",
    pronunciation: "Ven-tral",
    category: "Anatomie",
    definition: "Bauchwaerts gerichtet; zur Bauchseite (Venter) hin gelegen. Gegenteil: dorsal.",
    synonyms: [],
    relevance: "Haeufig in Kombination mit anderen Richtungsbezeichnungen (z.B. ventrolateral)."
},
{
    term: "Lateral",
    pronunciation: "La-te-ral",
    category: "Anatomie",
    definition: "Seitlich gelegen; von der Medianebene weg gerichtet. Gegenteil: medial.",
    synonyms: [],
    relevance: "Zentrale Orientierungshilfe bei Roentgen (z.B. laterolaterale Aufnahme) und Chirurgie."
},
{
    term: "Medial",
    pronunciation: "Me-di-al",
    category: "Anatomie",
    definition: "Zur Koerpermitte hin gelegen; in Richtung der Medianebene. Gegenteil: lateral.",
    synonyms: [],
    relevance: "Entscheidend fuer die Beschreibung von Gelenkstrukturen und Gefaessverlaeufen."
},
{
    term: "Proximal",
    pronunciation: "Pro-xi-mal",
    category: "Anatomie",
    definition: "Koerpernahe; naeher zum Rumpf gelegen (bei Extremitaeten). Gegenteil: distal.",
    synonyms: [],
    relevance: "Wird bei der Beschreibung von Frakturen und Gelenkpathologien verwendet."
},
{
    term: "Distal",
    pronunciation: "Dis-tal",
    category: "Anatomie",
    definition: "Koerperfern; weiter vom Rumpf entfernt gelegen (bei Extremitaeten). Gegenteil: proximal.",
    synonyms: [],
    relevance: "Wichtig in der orthopedischen und radiologischen Befundung."
},
{
    term: "Interkostalraum (ICR)",
    pronunciation: "In-ter-kos-tal-raum",
    category: "Anatomie",
    definition: "Zwischenrippenraum; der Raum zwischen zwei benachbarten Rippen, durchzogen von Interkostalmuskulatur, -nerven und -gefaessen.",
    synonyms: ["Spatium intercostale", "ICR"],
    relevance: "Referenzpunkt fuer Auskultation (z.B. optimaler Punkt fuer Herzauskultation bei Hund: 4.--5. ICR links), Thorakozentese und Thoraxdrainagen."
},
{
    term: "Peritoneum",
    pronunciation: "Pe-ri-to-ne-um",
    category: "Anatomie",
    definition: "Bauchfell; seroese Haut, die die Bauchhoehle auskleidet (parietales Blatt) und die Bauchorgane ueberzieht (viszerales Blatt).",
    synonyms: ["Bauchfell"],
    relevance: "Peritonitis (Entzuendung des Peritoneums) ist ein lebensbedrohlicher Notfall, haeufig nach Darmperforation oder Fremdkoerper."
},
{
    term: "Retroperitoneal",
    pronunciation: "Re-tro-pe-ri-to-ne-al",
    category: "Anatomie",
    definition: "Hinter dem Bauchfell gelegen. Organe in dieser Lage: Nieren, Nebennieren, Ureteren, Teile des Pankreas.",
    synonyms: [],
    relevance: "Retroperitoneale Blutungen oder Abszesse koennen klinisch schwer zu diagnostizieren sein und erfordern bildgebende Verfahren."
},
{
    term: "Mediastinum",
    pronunciation: "Me-di-as-ti-num",
    category: "Anatomie",
    definition: "Mittelfellraum; der zentrale Bereich im Thorax zwischen den beiden Pleurahoehlenseiten, der Herz, grosse Gefaesse, Oesophagus und Trachea enthaelt.",
    synonyms: ["Mittelfell"],
    relevance: "Mediastinale Massen (z.B. Lymphom bei der Katze) sind radiologisch als Verbreiterung des Mediastinums sichtbar."
},
{
    term: "Diaphragma",
    pronunciation: "Di-a-phrag-ma",
    category: "Anatomie",
    definition: "Zwerchfell; der kuppelfoermige Muskel, der Thorax- und Bauchhoehle trennt und als Hauptatemmuskel fungiert.",
    synonyms: ["Zwerchfell"],
    relevance: "Zwerchfellrupturen (traumatisch) fuehren zur Verlagerung von Bauchorganen in den Thorax -- eine haeufige Diagnose nach Autounfaellen."
},
{
    term: "Faszie",
    pronunciation: "Fas-zi-e",
    category: "Anatomie",
    definition: "Bindegewebshuelle, die Muskeln, Organe und Gefaesse umgibt und in Kompartimente unterteilt.",
    synonyms: ["Fascia"],
    relevance: "Kenntnis der Faszienebenen ist essenziell in der Chirurgie fuer korrekte Zugaenge und Wundverschluss."
},
{
    term: "Periost",
    pronunciation: "Pe-ri-ost",
    category: "Anatomie",
    definition: "Knochenhaut; die den Knochen umgebende bindegewebige Huelle mit osteogener Potenz und Schmerzrezeptoren.",
    synonyms: ["Knochenhaut", "Periosteum"],
    relevance: "Periostale Reaktionen im Roentgenbild weisen auf Frakturen, Infektionen oder Tumoren hin."
},
{
    term: "Epiphyse / Diaphyse / Metaphyse",
    pronunciation: "E-pi-phy-se / Di-a-phy-se / Me-ta-phy-se",
    category: "Anatomie",
    definition: "Knochenabschnitte: Epiphyse = Gelenkende, Diaphyse = Knochenschaft, Metaphyse = Uebergangszone zwischen beiden. Bei Jungtieren liegt hier die Wachstumsfuge (Epiphysenfuge).",
    synonyms: [],
    relevance: "Frakturen bei Jungtieren betreffen haeufig die Wachstumsfuge (Salter-Harris-Klassifikation). Tumoren wie das Osteosarkom entstehen bevorzugt in der Metaphyse."
},
{
    term: "Mesenterium",
    pronunciation: "Me-sen-te-ri-um",
    category: "Anatomie",
    definition: "Gekroese; doppelte Peritonealfalte, die den Darm an der Bauchwand befestigt und Gefaesse, Nerven und Lymphknoten fuehrt.",
    synonyms: ["Gekroese"],
    relevance: "Mesenteriale Lymphknoten koennen bei Lymphom oder Entzuendung vergroessert sein und sind palpatorisch oder sonographisch auffindbar."
},
{
    term: "Omentum",
    pronunciation: "O-men-tum",
    category: "Anatomie",
    definition: "Bauchnetz; fetthaltige Peritonealfalte (Omentum majus und minus), die als 'Bauchraumpolizist' Entzuendungsherde abschirmt.",
    synonyms: ["Bauchnetz", "Netz"],
    relevance: "Das grosse Netz wickelt sich haeufig um Fremdkoerper und Darmpathologien und wird chirurgisch als Pedikel-Flap genutzt."
},
{
    term: "Ligamentum",
    pronunciation: "Li-ga-men-tum",
    category: "Anatomie",
    definition: "Band; bindegewebige Struktur, die Knochen miteinander verbindet (Gelenkband) oder Organe fixiert.",
    synonyms: ["Band", "Ligament"],
    relevance: "Kreuzbandriss (Ruptur des Lig. cruciatum craniale) ist eine der haeufigsten orthopaedischen Erkrankungen beim Hund."
},
{
    term: "Processus",
    pronunciation: "Pro-zes-sus",
    category: "Anatomie",
    definition: "Knochenfortsatz; vorspringende knoeche Struktur, die als Muskelansatz oder Gelenkpartner dient (z.B. Processus spinosus, Processus coronoideus).",
    synonyms: ["Fortsatz"],
    relevance: "Fragmentierter Processus coronoideus (FPC) ist ein haeufiger Befund bei Ellbogendysplasie des Hundes."
},
{
    term: "Foramen",
    pronunciation: "Fo-ra-men",
    category: "Anatomie",
    definition: "Oeffnung in einem Knochen, durch die Gefaesse und Nerven verlaufen (z.B. Foramen magnum, Foramen obturatum).",
    synonyms: ["Knochenloch"],
    relevance: "Foramen-magnum-Fehlbildungen koennen bei Zwergrassen neurologische Symptome verursachen (Chiari-Malformation)."
},
{
    term: "Synovia",
    pronunciation: "Sy-no-vi-a",
    category: "Anatomie",
    definition: "Gelenkfluessigkeit (Gelenkschmiere); viskoese, hyaluronsaeurereiche Fluessigkeit, die den Gelenkknorpel ernaehrt und die Reibung minimiert.",
    synonyms: ["Gelenkfluessigkeit", "Synovialfluessigkeit"],
    relevance: "Synoviaanalyse (Zellzahl, Protein, Viskositaet) ist diagnostisch bei Arthritis, septischer Arthritis und immunmediierten Gelenkerkrankungen."
},

// =====================================================
// KLINISCHE UNTERSUCHUNG (16)
// =====================================================
{
    term: "Adspektion",
    pronunciation: "Ad-spek-ti-on",
    category: "Klinische Untersuchung",
    definition: "Untersuchung durch Betrachtung (Sehen). Erster Schritt der klinischen Untersuchung zur Erfassung von Haltung, Gangbild, Ernaehrungszustand und aeusseren Veraenderungen.",
    synonyms: ["Inspektion"],
    relevance: "Grundlage jeder klinischen Untersuchung. Bereits die Adspektion liefert wertvolle Hinweise auf Lahmheit, Dyspnoe oder Bewusstseinsveraenderungen."
},
{
    term: "Palpation",
    pronunciation: "Pal-pa-ti-on",
    category: "Klinische Untersuchung",
    definition: "Untersuchung durch Betasten. Beurteilung von Konsistenz, Groesse, Schmerzhaftigkeit und Temperatur von Geweben und Organen durch die Haende des Untersuchers.",
    synonyms: ["Betasten", "Abtasten"],
    relevance: "Erlaubt die Beurteilung von Lymphknoten, Abdomen, Gelenken und Weichteilschwellungen. Rektale Palpation ist beim Grosstier essenziell."
},
{
    term: "Perkussion",
    pronunciation: "Per-kus-si-on",
    category: "Klinische Untersuchung",
    definition: "Untersuchung durch Beklopfen. Beurteilung der darunterliegenden Strukturen anhand des erzeugten Schalls (sonor, gedaempft, tympanitisch, hypersonor).",
    synonyms: ["Abklopfen"],
    relevance: "Dient der Erkennung von Pleuraerguss (gedaempft), Pneumothorax (hypersonor) oder Tympanie (z.B. Labmagenverlagerung beim Rind)."
},
{
    term: "Auskultation",
    pronunciation: "Aus-kul-ta-ti-on",
    category: "Klinische Untersuchung",
    definition: "Untersuchung durch Abhoeren mit dem Stethoskop. Beurteilung von Herz-, Lungen- und Darmgeraueschen.",
    synonyms: ["Abhoeren"],
    relevance: "Identifikation von Herzgeraueschen (Murmurs), pathologischen Lungengeraueschen (Rasseln, Giemen) und Darmhyperakusis oder -stille."
},
{
    term: "KFZ (Kapillaere Fuellungszeit)",
    pronunciation: "Ka-pil-lae-re Fuel-lungs-zeit",
    category: "Klinische Untersuchung",
    definition: "Zeit, die eine durch Fingerdruck entfaerbte Schleimhautstelle (typischerweise Gingiva) benoetigt, um ihre Farbe zurueckzuerlangen. Normal: < 2 Sekunden.",
    synonyms: ["CRT (Capillary Refill Time)"],
    relevance: "Verlaengerte KFZ (> 2 s) deutet auf Dehydratation, Schock oder Kreislaufversagen hin. Einer der schnellsten Indikatoren fuer haemodyn. Instabilitaet."
},
{
    term: "BCS (Body Condition Score)",
    pronunciation: "Bo-di Kon-di-schen Skor",
    category: "Klinische Untersuchung",
    definition: "Standardisierte Bewertung des Ernaehrungszustandes anhand von Palpation und Adspektion. Skala: 1--5 oder 1--9 (speziesabhaengig), wobei 1 = kachektisch und 5/9 = adipoes.",
    synonyms: ["Koerperkonditonsbewertung"],
    relevance: "Wichtiges Monitoring-Tool in der Ernaehrungsberatung, bei chronischen Erkrankungen und zur Narkoseeinschaetzung."
},
{
    term: "Turgor (Hautturgor)",
    pronunciation: "Tur-gor",
    category: "Klinische Untersuchung",
    definition: "Hautelastizitaet; wird getestet durch Anheben einer Hautfalte (meist Nacken- oder Schulterbereich). Die Rueckbildungszeit gibt Aufschluss ueber den Hydratationsstatus.",
    synonyms: ["Hautfaltenstehzeit"],
    relevance: "Verlaengerter Hautturgor (> 2 s) weist auf Dehydratation hin. Ab ca. 5 % Dehydratation klinisch messbar."
},
{

    definition: "Erkrankung des Herzmuskels. DCM (dilatative KMP): Erweiterung und verminderte Kontraktilitaet der Herzkammern. HCM (hypertrophe KMP): Verdickung des Myokards mit eingeschraenkter Fuellungskapazitaet.",
    synonyms: ["Herzmuskelerkrankung"],
    relevance: "DCM v.a. bei grossen Hunderassen (Dobermann, Dogge). HCM ist die haeufigste Herzerkrankung der Katze -- kann zu Aortenthrombose fuehren."
},
{
    term: "Endokardiose",
    pronunciation: "En-do-kar-di-o-se",
    category: "Innere Medizin",
    definition: "Degenerative Verdickung der Herzklappen (myxomatoese Degeneration), fuehrt zu Klappeninsuffizienz. Auch bekannt als MMVD (Myxomatous Mitral Valve Disease).",
    synonyms: ["MMVD", "Myxomatoese Klappendegeneration"],
    relevance: "Haeufigste Herzerkrankung kleiner Hunderassen (Cavalier King Charles, Dackel). Stadieneinteilung nach ACVIM (A-D) fuer Therapieplanung."
},
{
    term: "Hypothyreose",
    pronunciation: "Hy-po-thy-re-o-se",
    category: "Innere Medizin",
    definition: "Unterfunktion der Schilddruese mit verminderter T4-Produktion. Haeufigste endokrine Erkrankung des Hundes.",
    synonyms: ["Schilddruesenunterfunktion"],
    relevance: "Klinik: Lethargie, Gewichtszunahme, symmetrische Alopezie, Bradykardie, 'tragischer Gesichtsausdruck'. Diagnose: fT4, TSH. Therapie: L-Thyroxin lebenslang."
},
{
    term: "Hyperthyreose",
    pronunciation: "Hy-per-thy-re-o-se",
    category: "Innere Medizin",
    definition: "Ueberfunktion der Schilddruese mit erhoehter T4-Produktion. Haeufigste endokrine Erkrankung der alten Katze.",
    synonyms: ["Schilddruesenueberfunktion"],
    relevance: "Klinik: Gewichtsverlust, Polyphagie, Tachykardie, Erbrechen, palpabler Schilddruesenknoten. Therapie: Thiamazol, Radiojod-Therapie oder Thyreoidektomie."
},
{
    term: "Cushing-Syndrom (Hyperadrenokortizismus)",
    pronunciation: "Ku-sching-Syn-drom",
    category: "Innere Medizin",
    definition: "Chronischer Glukokortikoid-Exzess, entweder durch ACTH-produzierendes Hypophysenadenom (85 %) oder Nebennierentumor (15 %). Iatrogen durch Langzeit-Glukokortikoidtherapie.",
    synonyms: ["Hyperadrenokortizismus", "HAK"],
    relevance: "Klinik: PU/PD, Polyphagie, Stammfettsucht, Alopezie, Haengbauch, Calcinosis cutis. Diagnose: LDDS-Test, ACTH-Stimulationstest. Therapie: Trilostan."
},
{
    term: "Addison-Krankheit (Hypoadrenokortizismus)",
    pronunciation: "A-di-son-Krank-heit",
    category: "Innere Medizin",
    definition: "Nebennierenrindeninsuffizienz mit Mangel an Glukokortikoiden und/oder Mineralokortikoiden. Oft immunmediiert.",
    synonyms: ["Hypoadrenokortizismus", "Morbus Addison"],
    relevance: "Klinik oft unspezifisch (Lethargie, Anorexie, Erbrechen). Addisonkrise = akuter Kollaps mit Bradykardie und Hyperkaliamie. 'Great Pretender' -- imitiert viele Erkrankungen."
},
{
    term: "Pankreatitis",
    pronunciation: "Pan-kre-a-ti-tis",
    category: "Innere Medizin",
    definition: "Entzuendung der Bauchspeichelgruese. Akut (nekrotisierend) oder chronisch (fibrosierend). Hund: oft nach fettreicher Mahlzeit. Katze: haeufig subklinisch.",
    synonyms: ["Bauchspeicheldruesenentzuendung"],
    relevance: "Diagnose: Spec cPL (Hund) / fPL (Katze) + Ultraschall. Therapie: Analgesie, Antiemese, Fluessigkeit, fruehe enterale Ernaehrung. Bei Katzen oft Triaditis (Pankreatitis + IBD + Cholangitis)."
}
];

// =====================================================
// KATEGORIEN & FARBEN
// =====================================================
const CATEGORIES = [
    { name: "Alle", color: "#818cf8" },
    { name: "Anatomie", color: "#60a5fa" },
    { name: "Klinische Untersuchung", color: "#34d399" },
    { name: "Pathologie", color: "#f87171" },
    { name: "Labormedizin", color: "#fbbf24" },
    { name: "Pharmakologie", color: "#a78bfa" },
    { name: "Chirurgie", color: "#fb923c" },
    { name: "Innere Medizin", color: "#38bdf8" }
];

// =====================================================
// STATE
// =====================================================
let activeCategory = "Alle";
let activeLetter = null;
let searchQuery = "";
let showFavoritesOnly = false;
let expandedEntries = new Set();

const FAV_KEY = "vetscan_glossary_favorites";

function getFavorites() {
    try { return JSON.parse(localStorage.getItem(FAV_KEY) || "[]"); }
    catch { return []; }
}

function setFavorites(favs) {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }
    catch {}
}

function toggleFavorite(term) {
    let favs = getFavorites();
    if (favs.includes(term)) {
        favs = favs.filter(f => f !== term);
    } else {
        favs.push(term);
    }
    setFavorites(favs);
    render();
}

function isFavorite(term) {
    return getFavorites().includes(term);
}

// =====================================================
// FILTERING
// =====================================================
function getFilteredEntries() {
    let entries = [...GLOSSARY];

    // Category filter
    if (activeCategory !== "Alle") {
        entries = entries.filter(e => e.category === activeCategory);
    }

    // Favorites filter
    if (showFavoritesOnly) {
        entries = entries.filter(e => isFavorite(e.term));
    }

    // Search filter
    if (searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        entries = entries.filter(e =>
            e.term.toLowerCase().includes(q) ||
            e.definition.toLowerCase().includes(q) ||
            (e.synonyms && e.synonyms.some(s => s.toLowerCase().includes(q))) ||
            e.category.toLowerCase().includes(q)
        );
    }

    // Letter filter
    if (activeLetter) {
        entries = entries.filter(e => {
            const first = e.term.replace(/[^A-Za-zAeOeUeae oe ue]/g, "").charAt(0).toUpperCase();
            return normalizeChar(first) === activeLetter;
        });
    }

    // Sort alphabetically
    entries.sort((a, b) => a.term.localeCompare(b.term, "de"));

    return entries;
}

function normalizeChar(c) {
    const map = { "Ä": "A", "Ö": "O", "Ü": "U", "ä": "a", "ö": "o", "ü": "u" };
    return (map[c] || c).toUpperCase();
}

function getFirstLetter(term) {
    // Handle special chars and umlauts
    const c = term.charAt(0).toUpperCase();
    return normalizeChar(c);
}

// =====================================================
// RENDERING
// =====================================================
function highlightText(text, query) {
    if (!query || !query.trim()) return text;
    const q = query.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return text.replace(new RegExp(`(${q})`, "gi"), "<mark>$1</mark>");
}

function getCategoryColor(catName) {
    const cat = CATEGORIES.find(c => c.name === catName);
    return cat ? cat.color : "#818cf8";
}

function renderCategoryBar() {
    const bar = document.getElementById("categoryBar");
    bar.innerHTML = CATEGORIES.map(cat => {
        const isActive = activeCategory === cat.name;
        const count = cat.name === "Alle"
            ? GLOSSARY.length
            : GLOSSARY.filter(e => e.category === cat.name).length;
        return `<button class="cat-tab${isActive ? ' active' : ''}"
                    style="${isActive ? `border-color: ${cat.color}; color: ${cat.color};` : ''}"
                    onclick="setCategory('${cat.name}')">${cat.name} (${count})</button>`;
    }).join("");
}

function renderAZBar() {
    const bar = document.getElementById("azBar");
    const filtered = getFilteredEntries();
    const availableLetters = new Set();

    // Check which letters have entries without the letter filter
    let entriesWithoutLetterFilter = [...GLOSSARY];
    if (activeCategory !== "Alle") {
        entriesWithoutLetterFilter = entriesWithoutLetterFilter.filter(e => e.category === activeCategory);
    }
    if (showFavoritesOnly) {
        entriesWithoutLetterFilter = entriesWithoutLetterFilter.filter(e => isFavorite(e.term));
    }
    if (searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        entriesWithoutLetterFilter = entriesWithoutLetterFilter.filter(e =>
            e.term.toLowerCase().includes(q) ||
            e.definition.toLowerCase().includes(q) ||
            (e.synonyms && e.synonyms.some(s => s.toLowerCase().includes(q))) ||
            e.category.toLowerCase().includes(q)
        );
    }
    entriesWithoutLetterFilter.forEach(e => availableLetters.add(getFirstLetter(e.term)));

    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    bar.innerHTML = letters.map(l => {
        const has = availableLetters.has(l);
        const isActive = activeLetter === l;
        return `<button class="az-btn${isActive ? ' active' : ''}${!has ? ' disabled' : ''}"
                    onclick="setLetter('${l}')"${!has ? ' disabled' : ''}>${l}</button>`;
    }).join("");
}

function renderEntries() {
    const container = document.getElementById("glossaryContent");
    const entries = getFilteredEntries();
    const favs = getFavorites();

    // Update stats
    document.getElementById("statsLine").innerHTML =
        `<span class="stat-num">${entries.length}</span> von ${GLOSSARY.length} Eintr&auml;gen` +
        (showFavoritesOnly ? ` &middot; <span style="color:#fbbf24">Nur Favoriten</span>` : "") +
        (searchQuery ? ` &middot; Suche: &bdquo;${searchQuery}&ldquo;` : "");

    // Update search count
    const sc = document.getElementById("searchCount");
    if (searchQuery) {
        sc.textContent = `${entries.length} Treffer`;
        sc.classList.remove("hidden");
    } else {
        sc.classList.add("hidden");
    }

    if (entries.length === 0) {
        container.innerHTML = `
            <div class="text-center py-20 text-gray-500">
                <div class="text-5xl mb-4">&#128269;</div>
                <p class="text-lg">Keine Eintr&auml;ge gefunden.</p>
                <p class="text-sm mt-2">Versuche einen anderen Suchbegriff oder Filter.</p>
            </div>`;
        return;
    }

    // Group by first letter
    const groups = {};
    entries.forEach(e => {
        const letter = getFirstLetter(e.term);
        if (!groups[letter]) groups[letter] = [];
        groups[letter].push(e);
    });

    const sortedLetters = Object.keys(groups).sort();

    container.innerHTML = sortedLetters.map(letter => {
        const items = groups[letter];
        return `
            <div id="letter-${letter}" class="mb-6">
                <div class="letter-heading">${letter}</div>
                <div class="flex flex-col gap-3">
                    ${items.map(entry => renderEntry(entry)).join("")}
                </div>
            </div>`;
    }).join("");
}

function renderEntry(entry) {
    const isExpanded = expandedEntries.has(entry.term);
    const isFav = isFavorite(entry.term);
    const color = getCategoryColor(entry.category);
    const q = searchQuery;

    return `
        <div class="entry-card${isExpanded ? ' expanded' : ''}" onclick="toggleEntry('${entry.term.replace(/'/g, "\\'")}')">
            <div class="flex items-start gap-3">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-3 flex-wrap">
                        <span class="text-lg font-bold text-white">${highlightText(entry.term, q)}</span>
                        <span class="cat-badge" style="background: ${color}22; color: ${color}; border: 1px solid ${color}44;">
                            ${entry.category}
                        </span>
                    </div>
                    <div class="text-sm text-gray-400 italic mt-1">[${entry.pronunciation}]</div>
                    <p class="text-sm text-gray-300 mt-2 leading-relaxed">${highlightText(entry.definition, q)}</p>
                </div>
                <button class="fav-btn${isFav ? ' favorited' : ''}"
                        onclick="event.stopPropagation(); toggleFavorite('${entry.term.replace(/'/g, "\\'")}')"
                        title="${isFav ? 'Aus Favoriten entfernen' : 'Zu Favoriten hinzufuegen'}"
                        aria-label="${isFav ? 'Aus Favoriten entfernen' : 'Zu Favoriten hinzufuegen'}">
                    ${isFav ? "&#9733;" : "&#9734;"}
                </button>
            </div>
            <div class="entry-details">
                <div class="mt-4 pt-4 border-t border-white/10 space-y-3">
                    ${entry.synonyms && entry.synonyms.length > 0 ? `
                        <div>
                            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Synonyme</span>
                            <p class="text-sm text-gray-300 mt-1">${highlightText(entry.synonyms.join(", "), q)}</p>
                        </div>
                    ` : ""}
                    ${entry.relevance ? `
                        <div>
                            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Klinische Relevanz</span>
                            <p class="text-sm text-gray-300 mt-1 leading-relaxed">${highlightText(entry.relevance, q)}</p>
                        </div>
                    ` : ""}
                </div>
            </div>
        </div>`;
}

function render() {
    renderCategoryBar();
    renderAZBar();
    renderEntries();
}

// =====================================================
// INTERACTIONS
// =====================================================
function setCategory(cat) {
    activeCategory = cat;
    activeLetter = null;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function setLetter(letter) {
    if (activeLetter === letter) {
        activeLetter = null;
    } else {
        activeLetter = letter;
    }
    render();

    // Scroll to letter section
    if (activeLetter) {
        const el = document.getElementById("letter-" + activeLetter);
        if (el) {
            el.scrollIntoView({ behavior: "smooth", block: "start" });
        }
    }
}

function toggleEntry(term) {
    if (expandedEntries.has(term)) {
        expandedEntries.delete(term);
    } else {
        expandedEntries.add(term);
    }
    render();
}

function toggleFavFilter() {
    showFavoritesOnly = !showFavoritesOnly;
    const btn = document.getElementById("favFilterBtn");
    if (showFavoritesOnly) {
        btn.classList.add("active");
        btn.style.borderColor = "#fbbf24";
        btn.style.color = "#fbbf24";
    } else {
        btn.classList.remove("active");
        btn.style.borderColor = "";
        btn.style.color = "";
    }
    render();
}

function showRandomEntry() {
    const entries = activeCategory === "Alle" ? GLOSSARY : GLOSSARY.filter(e => e.category === activeCategory);
    if (entries.length === 0) return;
    const entry = entries[Math.floor(Math.random() * entries.length)];

    // Reset filters to show the entry
    searchQuery = "";
    document.getElementById("searchInput").value = "";
    activeLetter = null;
    showFavoritesOnly = false;
    const btn = document.getElementById("favFilterBtn");
    btn.classList.remove("active");
    btn.style.borderColor = "";
    btn.style.color = "";

    // Expand the entry
    expandedEntries.clear();
    expandedEntries.add(entry.term);

    render();

    // Scroll to it
    requestAnimationFrame(() => {
        const cards = document.querySelectorAll(".entry-card.expanded");
        if (cards.length > 0) {
            cards[0].scrollIntoView({ behavior: "smooth", block: "center" });
            cards[0].style.boxShadow = "0 0 30px rgba(102, 126, 234, 0.4)";
            setTimeout(() => { cards[0].style.boxShadow = ""; }, 2000);
        }
    });
}

// =====================================================
// SEARCH (debounced)
// =====================================================
let searchTimeout;
document.getElementById("searchInput").addEventListener("input", function(e) {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        searchQuery = e.target.value;
        activeLetter = null;
        expandedEntries.clear();

        // Auto-expand if few results
        const filtered = getFilteredEntries();
        if (filtered.length <= 5 && filtered.length > 0) {
            filtered.forEach(entry => expandedEntries.add(entry.term));
        }

        render();
    }, 150);
});

// Keyboard shortcut: focus search with /
document.addEventListener("keydown", function(e) {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
        e.preventDefault();
        document.getElementById("searchInput").focus();
    }
    if (e.key === "Escape") {
        document.getElementById("searchInput").blur();
        if (searchQuery) {
            searchQuery = "";
            document.getElementById("searchInput").value = "";
            render();
        }
    }
});

// =====================================================
// SCROLL-TO-TOP BUTTON
// =====================================================
window.addEventListener("scroll", function() {
    const btn = document.getElementById("scrollTopBtn");
    if (window.scrollY > 400) {
        btn.style.opacity = "1";
        btn.style.pointerEvents = "auto";
    } else {
        btn.style.opacity = "0";
        btn.style.pointerEvents = "none";
    }
});

// =====================================================
// INIT
// =====================================================
render();

// Track in VetScan progress
if (typeof VetScan !== "undefined" && VetScan.saveProgress) {
    VetScan.saveProgress("glossary", { totalEntries: GLOSSARY.length });
}
</script>

<script src="js/vetscan-pro.js"></script>
