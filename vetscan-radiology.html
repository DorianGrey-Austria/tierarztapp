<html lang="de">
<head>

    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2234;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --xray-bg: #050810;
            --xray-bone: #d4d8e0;
            --xray-soft: #4a5568;
            --xray-air: #1a1a2e;
            --xray-fluid: #6b7280;
            --xray-pathology: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .xray-viewer {
            background: var(--xray-bg);
            border: 2px solid #1e293b;
            border-radius: 12px;
            position: relative;
            cursor: crosshair;
        }

        .xray-viewer svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .annotation-marker {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 2px solid var(--warning);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            animation: pulse-ring 2s infinite;
            z-index: 10;
        }

        .annotation-marker.correct { border-color: var(--success); }
        .annotation-marker.incorrect { border-color: var(--danger); }

        .annotation-marker .marker-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            font-weight: 700;
            color: var(--warning);
        }

        .annotation-marker.correct .marker-number { color: var(--success); }
        .annotation-marker.incorrect .marker-number { color: var(--danger); }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .checklist-item {
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(30, 41, 59, 0.5);
            margin-bottom: 4px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .checklist-item:hover { background: rgba(59, 130, 246, 0.1); }
        .checklist-item.checked { background: rgba(34, 197, 94, 0.1); border-left: 3px solid var(--success); }
        .checklist-item.missed { background: rgba(239, 68, 68, 0.1); border-left: 3px solid var(--danger); }

        .step-indicator {
            display: flex;
            gap: 2px;
            align-items: center;
        }

        .step-dot {
            width: 32px;
            height: 4px;
            border-radius: 2px;
            background: #334155;
            transition: background 0.3s;
        }

        .step-dot.active { background: var(--accent); }
        .step-dot.done { background: var(--success); }

        .vhs-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .vhs-overlay.active { pointer-events: all; }

        .vhs-line {
            stroke: #f59e0b;
            stroke-width: 2;
            stroke-dasharray: 6 3;
            cursor: grab;
        }

        .vhs-handle {
            fill: #f59e0b;
            stroke: #fff;
            stroke-width: 1;
            cursor: grab;
            r: 6;
        }

        .vhs-handle:hover { r: 8; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

        .finding-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .finding-tag.normal { background: rgba(34, 197, 94, 0.2); color: #86efac; }
        .finding-tag.pathological { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .finding-tag.artifact { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }

        .score-bar {
            height: 8px;
            border-radius: 4px;
            background: #1e293b;
            overflow: hidden;
        }

        .score-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s ease;
        }

        .tab-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
        }

        .case-card {
            background: var(--bg-card);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .case-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .case-card.completed { border-color: var(--success); }

        .dropdown-select {
            background: #1e293b;
            border: 1px solid #334155;
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            width: 100%;
            font-size: 14px;
        }

        .text-input {
            background: #1e293b;
            border: 1px solid #334155;
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            width: 100%;
            font-size: 14px;
            resize: vertical;
        }

        .text-input:focus, .dropdown-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .systematic-step {
            padding: 12px 16px;
            border-radius: 8px;
            background: rgba(30, 41, 59, 0.3);
            border-left: 3px solid #334155;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .systematic-step.active {
            background: rgba(59, 130, 246, 0.1);
            border-left-color: var(--accent);
        }

        .systematic-step.completed {
            border-left-color: var(--success);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        @media (max-width: 768px) {

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }

</style>

// ============================================================
// SVG GENERATORS - Schematic radiographic images
// ============================================================

function generateSVG(caseId, width = 600, height = 450) {
    const generators = {
        'normal-thorax': svgNormalThorax,
        'cardiomegaly': svgCardiomegaly,
        'pulmonary-edema': svgPulmonaryEdema,
        'pleural-effusion': svgPleuralEffusion,
        'pneumothorax': svgPneumothorax,
        'foreign-body': svgForeignBody,
        'fracture': svgFracture,
        'megaesophagus': svgMegaesophagus
    };
    return (generators[caseId] || svgNormalThorax)(width, height);
}

// Helper: generate spine vertebrae
function generateSpine(w, h, count, startY = 0.06) {
    let svg = '';
    for (let i = 0; i < count; i++) {
        const y = h * (startY + i * (0.065));
        if (y > h * 0.9) break;
        svg += `<rect x="${w*0.47}" y="${y}" width="${w*0.06}" height="${h*0.04}" rx="3" fill="#8a9ab0" stroke="#a0b0c0" stroke-width="0.5" opacity="0.7"/>`;
        // Spinous process
        svg += `<line x1="${w*0.5}" y1="${y}" x2="${w*0.5}" y2="${y - h*0.015}" stroke="#8a9ab0" stroke-width="1.5" opacity="0.5"/>`;
    }
    return svg;
}

// Helper: generate ribs
function generateRibs(w, h, count) {
    let svg = '';
    for (let i = 0; i < count; i++) {
        const y = h * (0.1 + i * 0.058);
        if (y > h * 0.8) break;
        const curve = 0.15 + (i / count) * 0.08;
        // Left rib
        svg += `<path d="M ${w*0.47} ${y} Q ${w*(0.47 - curve)} ${y + h*0.03} ${w*(0.47 - curve - 0.05)} ${y + h*0.08}" fill="none" stroke="#6a7a8a" stroke-width="1.5" opacity="0.5"/>`;
        // Right rib
        svg += `<path d="M ${w*0.53} ${y} Q ${w*(0.53 + curve)} ${y + h*0.03} ${w*(0.53 + curve + 0.05)} ${y + h*0.08}" fill="none" stroke="#6a7a8a" stroke-width="1.5" opacity="0.5"/>`;
    }
    return svg;
}

                                <button class="btn-primary text-xs w-full" data-action="save-step-finding" style="padding: 8px;">
                                    Befund speichern & weiter
                                </button>
                            </div>
                        ` : `
                            <!-- Study mode or solution view -->
                            ${(() => {
                                const stepId = SYSTEMATIC_STEPS[state.currentStep].id;
                                const finding = c.findings.find(f => f.region === stepId);
                                if (!finding) return '<p class="text-gray-500 text-sm">Kein Befund fuer diesen Bereich.</p>';

                                const userF = state.userFindings[stepId];
                                const showComparison = state.showSolution && userF;

                                return `
                                <div class="space-y-3">
                                    <div>
                                        <span class="text-xs text-gray-500">Struktur</span>
                                        <p class="text-sm text-white">${finding.structure}</p>
                                    </div>
                                    <div>
                                        <span class="text-xs text-gray-500">Befund</span>
                                        <div class="flex items-center gap-2 mt-1">
                                            <span class="finding-tag ${finding.status === 'normal' ? 'normal' : 'pathological'}">
                                                ${finding.status === 'normal' ? 'Normal' : 'Pathologisch'}
                                            </span>
                                        </div>
                                    </div>
                                    <div>
                                        <span class="text-xs text-gray-500">Beschreibung</span>
                                        <p class="text-sm text-gray-300 mt-1">${finding.description}</p>
                                    </div>
                                    ${showComparison ? `
                                        <div class="border-t border-gray-700 pt-3">
                                            <span class="text-xs text-gray-500">Ihre Antwort</span>
                                            <div class="flex items-center gap-2 mt-1">
                                                <span class="finding-tag ${userF.status === finding.status ? 'normal' : 'pathological'}">
                                                    ${userF.status === finding.status ? 'Korrekt' : 'Falsch'}
                                                </span>
                                                <span class="text-xs text-gray-400">(${userF.status || 'keine Angabe'})</span>
                                            </div>
                                            ${userF.description ? `<p class="text-xs text-gray-400 mt-1 italic">"${userF.description}"</p>` : ''}
                                        </div>
                                    ` : ''}
                                </div>`;
                            })()}
                        `}
                    </div>

                    <!-- Annotations List -->
                    ${state.annotations.length > 0 ? `
                        <div class="bg-gray-800/40 rounded-xl p-4">
                            <h4 class="text-sm font-semibold text-gray-400 mb-3">Markierungen (${state.annotations.length})</h4>
                            <div class="space-y-2 max-h-48 overflow-y-auto">
                                ${state.annotations.map((a, i) => `
                                    <div class="flex items-start justify-between p-2 rounded-lg" style="background: rgba(30,41,59,0.4);">
                                        <div class="flex items-start gap-2">
                                            <span class="text-xs font-mono text-amber-400">${i + 1}</span>
                                            <div>
                                                <p class="text-xs text-gray-300">${a.note || 'Keine Notiz'}</p>
                                                ${a.evaluated !== undefined ? `
                                                    <span class="text-xs ${a.correct ? 'text-green-400' : 'text-red-400'}">
                                                        ${a.correct ? 'Richtig' : 'Nicht relevant'}
                                                    </span>
                                                ` : ''}
                                            </div>
                                        </div>
                                        <button class="text-gray-600 hover:text-red-400 text-xs" data-action="remove-annotation" data-index="${i}">x</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            </div>
        </main>

        <!-- Annotation Modal -->
        ${state.annotationModalOpen ? renderAnnotationModal() : ''}
        <!-- Results Modal -->
        ${state.resultsModalOpen ? renderResultsModal() : ''}
    </div>`;
}

function renderVHSOverlay() {
    return `
    <svg class="vhs-overlay ${state.vhsActive ? 'active' : ''}" viewBox="0 0 600 450" id="vhs-svg">
        <!-- Long axis guide line -->
        <line x1="240" y1="200" x2="310" y2="340" class="vhs-line" id="vhs-long-line"/>
        <circle cx="240" cy="200" class="vhs-handle" id="vhs-long-start"/>
        <circle cx="310" cy="340" class="vhs-handle" id="vhs-long-end"/>
        <!-- Short axis guide line -->
        <line x1="220" y1="260" x2="340" y2="280" class="vhs-line" id="vhs-short-line"/>
        <circle cx="220" cy="260" class="vhs-handle" id="vhs-short-start"/>
        <circle cx="340" cy="280" class="vhs-handle" id="vhs-short-end"/>
        <!-- Labels -->
        <text x="270" y="195" fill="#f59e0b" font-size="10" text-anchor="middle" font-family="sans-serif">L</text>
        <text x="285" y="255" fill="#f59e0b" font-size="10" text-anchor="middle" font-family="sans-serif">Q</text>
    </svg>`;
}

function renderAnnotationModal() {
    return `
    <div class="modal-overlay" data-action="close-modal">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 class="text-lg font-bold text-white mb-4">Markierung hinzufuegen</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-sm text-gray-400">Was sehen Sie an dieser Stelle?</label>
                    <textarea class="text-input mt-1" rows="3" id="annotation-note" placeholder="z.B. Erhoehte Verschattung, Frakturlinie, Fremdkoerper..."></textarea>
                </div>
                <div>
                    <label class="text-sm text-gray-400">Beurteilung</label>
                    <select class="dropdown-select mt-1" id="annotation-type">
                        <option value="finding">Befund</option>
                        <option value="normal">Normal</option>
                        <option value="artifact">Artefakt</option>
                    </select>
                </div>
                <div class="flex gap-3 justify-end">
                    <button class="btn-secondary" data-action="cancel-annotation">Abbrechen</button>
                    <button class="btn-primary" data-action="confirm-annotation">Markierung setzen</button>
                </div>
            </div>
        </div>
    </div>`;
}

function renderResultsModal() {
    const c = state.currentCase;
    if (!c) return '';

    const pathFindings = c.findings.filter(f => f.status === 'pathological');
    const totalFindings = c.findings.length;
    let correctCount = 0;
    let detailRows = '';

    c.findings.forEach(f => {
        const userF = state.userFindings[f.region];
        const statusMatch = userF && userF.status === f.status;
        if (statusMatch) correctCount++;

        detailRows += `
        <div class="p-3 rounded-lg mb-2" style="background: rgba(30,41,59,0.4);">
            <div class="flex items-center justify-between mb-1">
                <span class="text-sm text-white">${f.structure}</span>
                <div class="flex items-center gap-2">
                    <span class="finding-tag ${f.status === 'normal' ? 'normal' : 'pathological'}">${f.status === 'normal' ? 'Normal' : 'Pathologisch'}</span>
                    ${userF ? `
                        <span class="text-xs ${statusMatch ? 'text-green-400' : 'text-red-400'}">
                            ${statusMatch ? 'Korrekt erkannt' : 'Falsch beurteilt'}
                        </span>
                    ` : '<span class="text-xs text-gray-500">Nicht beurteilt</span>'}
                </div>
            </div>
            <p class="text-xs text-gray-400">${f.description}</p>
        </div>`;
    });

    const score = Math.round((correctCount / totalFindings) * 100);

    return `
    <div class="modal-overlay">
        <div class="modal-content" style="max-width: 700px;">
            <div class="text-center mb-6">
                <div class="text-5xl font-bold mb-2 ${score >= 70 ? 'text-green-400' : score >= 40 ? 'text-amber-400' : 'text-red-400'}">${score}%</div>
                <p class="text-gray-400">
                    ${correctCount} von ${totalFindings} Befunden korrekt beurteilt
                </p>
                <div class="score-bar mt-3 mx-auto" style="max-width: 300px;">
                    <div class="score-bar-fill" style="width: ${score}%; background: ${score >= 70 ? 'var(--success)' : score >= 40 ? 'var(--warning)' : 'var(--danger)'}"></div>
                </div>
            </div>

            <h4 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">Musterloesung</h4>
            <div class="max-h-60 overflow-y-auto mb-6">
                ${detailRows}
            </div>

            <div class="flex gap-3 justify-end">
                <button class="btn-secondary" data-action="close-results-to-overview">Uebersicht</button>
                <button class="btn-primary" data-action="close-results-review">Befunde durchsehen</button>
            </div>
        </div>
    </div>`;
}

function renderResults() {
    // Full results page after completing all cases
    const totalCases = CASES.length;
    const completedCases = state.completedCases.size;
    const allScores = Object.values(state.scores);
    const avgScore = allScores.length > 0 ? Math.round(allScores.reduce((a,b) => a+b, 0) / allScores.length) : 0;

    return `
    <div class="min-h-screen flex items-center justify-center" style="background: var(--bg-primary);">
        <div class="text-center max-w-lg">
            <div class="text-6xl font-bold mb-4 ${avgScore >= 70 ? 'text-green-400' : avgScore >= 40 ? 'text-amber-400' : 'text-red-400'}">${avgScore}%</div>
            <h2 class="text-2xl font-bold text-white mb-2">Durchschnittliche Bewertung</h2>
            <p class="text-gray-400 mb-8">${completedCases} von ${totalCases} Faellen abgeschlossen</p>
            <div class="space-y-3 mb-8 text-left">
                ${CASES.map(c => {
                    const score = state.scores[c.id];
                    return `
                    <div class="flex items-center gap-3">
                        <div class="flex-1">
                            <div class="text-sm text-gray-300">${c.title}</div>
                            <div class="score-bar mt-1">
                                <div class="score-bar-fill" style="width: ${score || 0}%; background: ${(score || 0) >= 70 ? 'var(--success)' : (score || 0) >= 40 ? 'var(--warning)' : 'var(--danger)'}"></div>
                            </div>
                        </div>
                        <span class="text-sm font-mono text-gray-400 w-12 text-right">${score !== undefined ? score + '%' : '--'}</span>
                    </div>`;
                }).join('')}
            </div>
            <button class="btn-primary" data-action="back-to-overview">Zurueck zur Uebersicht</button>
        </div>
    </div>`;
}

// ============================================================
// HELPERS
// ============================================================

function getVHSColor(vhs, caseData) {
    if (vhs === 0) return 'text-gray-500';
    const isNormal = caseData.species === 'Hund' ? (vhs >= 9.2 && vhs <= 10.2) : (vhs >= 7.2 && vhs <= 7.8);
    return isNormal ? 'text-green-400' : 'text-red-400';
}

// ============================================================
// EVENT HANDLING
// ============================================================

function attachEvents() {
    document.querySelectorAll('[data-action]').forEach(el => {
        const action = el.dataset.action;

        switch(action) {
            case 'set-mode':
                el.addEventListener('click', () => {
                    state.mode = el.dataset.mode;
                    render();
                });
                break;

            case 'open-case':
                el.addEventListener('click', () => {
                    const c = CASES.find(x => x.id === el.dataset.caseId);
                    if (c) {
                        state.currentCase = c;
                        state.currentView = 'case';
                        state.currentStep = 0;
                        state.annotations = [];
                        state.userFindings = {};
                        state.showSolution = false;
                        state.vhsActive = false;
                        state.vhsLongAxis = 0;
                        state.vhsShortAxis = 0;
                        state.annotationModalOpen = false;
                        state.resultsModalOpen = false;
                        render();
                    }
                });
                break;

            case 'back-to-overview':
                el.addEventListener('click', () => {
                    state.currentView = 'overview';
                    state.currentCase = null;
                    render();
                });
                break;

            case 'select-step':
                el.addEventListener('click', () => {
                    state.currentStep = parseInt(el.dataset.step);
                    render();
                });
                break;

            case 'annotate-click':
                el.addEventListener('click', (e) => {
                    if (state.vhsActive) return;
                    if (e.target.closest('.annotation-marker')) return;
                    if (e.target.closest('.vhs-overlay')) return;

                    const rect = el.getBoundingClientRect();
                    const x = ((e.clientX - rect.left) / rect.width) * 100;
                    const y = ((e.clientY - rect.top) / rect.height) * 100;

                    state.pendingAnnotation = { x, y };
                    state.annotationModalOpen = true;
                    render();
                });
                break;

            case 'close-modal':
                el.addEventListener('click', () => {
                    state.annotationModalOpen = false;
                    state.pendingAnnotation = null;
                    render();
                });
                break;

            case 'cancel-annotation':
                el.addEventListener('click', () => {
                    state.annotationModalOpen = false;
                    state.pendingAnnotation = null;
                    render();
                });
                break;

            case 'confirm-annotation':
                el.addEventListener('click', () => {
                    const noteEl = document.getElementById('annotation-note');
                    const typeEl = document.getElementById('annotation-type');
                    if (state.pendingAnnotation) {
                        state.annotations.push({
                            ...state.pendingAnnotation,
                            note: noteEl ? noteEl.value : '',
                            type: typeEl ? typeEl.value : 'finding'
                        });
                    }
                    state.annotationModalOpen = false;
                    state.pendingAnnotation = null;
                    render();
                });
                break;

            case 'remove-annotation':
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(el.dataset.index);
                    state.annotations.splice(idx, 1);
                    render();
                });
                break;

            case 'edit-annotation':
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // Could open edit modal -- for now just highlight
                });
                break;

            case 'toggle-vhs':
                el.addEventListener('click', () => {
                    state.vhsActive = !state.vhsActive;
                    render();
                });
                break;

            case 'save-step-finding':
                el.addEventListener('click', () => {
                    const statusEl = document.getElementById('finding-status');
                    const descEl = document.getElementById('finding-description');
                    const stepId = SYSTEMATIC_STEPS[state.currentStep].id;

                    state.userFindings[stepId] = {
                        status: statusEl ? statusEl.value : '',
                        description: descEl ? descEl.value : ''
                    };

                    if (state.currentStep < SYSTEMATIC_STEPS.length - 1) {
                        state.currentStep++;
                    }
                    render();
                });
                break;

            case 'update-finding-status':
                el.addEventListener('change', () => {
                    const stepId = SYSTEMATIC_STEPS[state.currentStep].id;
                    if (!state.userFindings[stepId]) state.userFindings[stepId] = {};
                    state.userFindings[stepId].status = el.value;
                });
                break;

            case 'update-finding-desc':
                el.addEventListener('input', () => {
                    const stepId = SYSTEMATIC_STEPS[state.currentStep].id;
                    if (!state.userFindings[stepId]) state.userFindings[stepId] = {};
                    state.userFindings[stepId].description = el.value;
                });
                break;

            case 'submit-findings':
                el.addEventListener('click', () => {
                    evaluateFindings();
                });
                break;

            case 'close-results-to-overview':
                el.addEventListener('click', () => {
                    state.resultsModalOpen = false;
                    state.currentView = 'overview';
                    state.currentCase = null;
                    render();
                });
                break;

            case 'close-results-review':
                el.addEventListener('click', () => {
                    state.resultsModalOpen = false;
                    state.showSolution = true;
                    state.currentStep = 0;
                    render();
                });
                break;

            case 'next-case':
                el.addEventListener('click', () => {
                    const currentIdx = CASES.findIndex(c => c.id === state.currentCase.id);
                    const nextIdx = (currentIdx + 1) % CASES.length;
                    const nextCase = CASES[nextIdx];
                    state.currentCase = nextCase;
                    state.currentStep = 0;
                    state.annotations = [];
                    state.userFindings = {};
                    state.showSolution = false;
                    state.vhsActive = false;
                    state.vhsLongAxis = 0;
                    state.vhsShortAxis = 0;
                    state.annotationModalOpen = false;
                    state.resultsModalOpen = false;
                    render();
                });
                break;
        }
    });

    // VHS input handlers
    const vhsLong = document.getElementById('vhs-long');
    const vhsShort = document.getElementById('vhs-short');
    if (vhsLong) {
        vhsLong.addEventListener('input', () => {
            state.vhsLongAxis = parseFloat(vhsLong.value) || 0;
            updateVHSDisplay();
        });
    }
    if (vhsShort) {
        vhsShort.addEventListener('input', () => {
            state.vhsShortAxis = parseFloat(vhsShort.value) || 0;
            updateVHSDisplay();
        });
    }

    // VHS draggable handles
    setupVHSDrag();
}

function updateVHSDisplay() {
    const resultEl = document.getElementById('vhs-result');
    if (resultEl && state.currentCase) {
        const total = state.vhsLongAxis + state.vhsShortAxis;
        resultEl.textContent = total.toFixed(1) + ' WK';
        resultEl.className = 'text-2xl font-bold ' + getVHSColor(total, state.currentCase);
    }
}

function setupVHSDrag() {
    const svgEl = document.getElementById('vhs-svg');
    if (!svgEl) return;

    let dragging = null;
    let startPos = { x: 0, y: 0 };

    const handles = svgEl.querySelectorAll('.vhs-handle');
    handles.forEach(handle => {
        handle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dragging = handle;
            const rect = svgEl.getBoundingClientRect();
            const svgPoint = svgEl.createSVGPoint();
            svgPoint.x = e.clientX;
            svgPoint.y = e.clientY;
            startPos = { x: e.clientX, y: e.clientY };
        });
    });

    svgEl.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        e.preventDefault();

        const rect = svgEl.getBoundingClientRect();
        const scaleX = 600 / rect.width;
        const scaleY = 450 / rect.height;
        const newX = (e.clientX - rect.left) * scaleX;
        const newY = (e.clientY - rect.top) * scaleY;

        dragging.setAttribute('cx', newX);
        dragging.setAttribute('cy', newY);

        // Update corresponding line endpoint
        const lineId = dragging.id.replace('-start', '-line').replace('-end', '-line');
        const line = document.getElementById(lineId);
        if (line) {
            if (dragging.id.endsWith('-start')) {
                line.setAttribute('x1', newX);
                line.setAttribute('y1', newY);
            } else {
                line.setAttribute('x2', newX);
                line.setAttribute('y2', newY);
            }
        }

        // Calculate distances and update VHS
        recalcVHSFromHandles();
    });

    svgEl.addEventListener('mouseup', () => { dragging = null; });
    svgEl.addEventListener('mouseleave', () => { dragging = null; });
}

function recalcVHSFromHandles() {
    const longStart = document.getElementById('vhs-long-start');
    const longEnd = document.getElementById('vhs-long-end');
    const shortStart = document.getElementById('vhs-short-start');
    const shortEnd = document.getElementById('vhs-short-end');

    if (!longStart || !longEnd || !shortStart || !shortEnd) return;

    const longDist = Math.sqrt(
        Math.pow(parseFloat(longEnd.getAttribute('cx')) - parseFloat(longStart.getAttribute('cx')), 2) +
        Math.pow(parseFloat(longEnd.getAttribute('cy')) - parseFloat(longStart.getAttribute('cy')), 2)
    );
    const shortDist = Math.sqrt(
        Math.pow(parseFloat(shortEnd.getAttribute('cx')) - parseFloat(shortStart.getAttribute('cx')), 2) +
        Math.pow(parseFloat(shortEnd.getAttribute('cy')) - parseFloat(shortStart.getAttribute('cy')), 2)
    );

    // Approximate: one vertebral body ~ 28px in our SVG scale
    const vertebralUnit = 28;
    state.vhsLongAxis = Math.round((longDist / vertebralUnit) * 10) / 10;
    state.vhsShortAxis = Math.round((shortDist / vertebralUnit) * 10) / 10;

    const vhsLongInput = document.getElementById('vhs-long');
    const vhsShortInput = document.getElementById('vhs-short');
    if (vhsLongInput) vhsLongInput.value = state.vhsLongAxis;
    if (vhsShortInput) vhsShortInput.value = state.vhsShortAxis;

    updateVHSDisplay();
}

function evaluateFindings() {
    const c = state.currentCase;
    if (!c) return;

    let correct = 0;
    const total = c.findings.length;

    c.findings.forEach(f => {
        const userF = state.userFindings[f.region];
        if (userF && userF.status === f.status) {
            correct++;
        }
    });

    // Evaluate annotations
    state.annotations.forEach(a => {
        a.evaluated = true;
        // Simple proximity check: is the annotation near a pathological finding?
        // In a real app this would use region detection on the SVG
        const hasPathology = c.findings.some(f => f.status === 'pathological');
        a.correct = a.type === 'finding' && hasPathology;
    });

    const score = Math.round((correct / total) * 100);
    state.scores[c.id] = score;
    state.completedCases.add(c.id);
    state.resultsModalOpen = true;

    render();
}

// ============================================================
// INIT
// ============================================================

render();
</script>
